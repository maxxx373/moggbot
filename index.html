// Так лента обновляется: каждую неделю приходят 2 новые статьи с пометкой «новое».
const ARTICLES_LONG = [
  { id: 'x1', wk: 0, tag: 'Уход', img: 'sink', art: 'a11', t: 'Уход за кожей для парней: схема на 5 минут в день', min: 8, body: [
    'Большинство парней либо не делают с кожей ничего, либо покупают сразу десять баночек, через неделю бросают и решают, что «уход — это не для меня». Правда посередине: для заметного результата хватает трёх шагов и пяти минут в день. Главное — делать это каждый день, а не красиво.',
    { h: 'Шаг 1. Умывание' },
    'Обычное мыло сушит кожу и ломает её защитный барьер. Из-за этого кожа стягивается, шелушится — и, как ни странно, начинает жирнеть ещё сильнее, чтобы защититься. Нужен мягкий гель для умывания: утром и вечером, 30–60 секунд, тёплой (не горячей) водой.',
    'Как понять, что гель подходит: после умывания кожа чистая, но не скрипит и не стягивается. Если стягивается — гель слишком агрессивный.',
    { h: 'Шаг 2. Увлажнение' },
    'Миф номер один: «у меня жирная кожа, мне крем не нужен». Нужен. Жирная кожа тоже бывает обезвоженной, и без крема она производит ещё больше себума. Просто выбирай лёгкую текстуру — лосьон или гель-крем.',
    'Наноси на чуть влажную кожу сразу после умывания — так крем работает лучше. Хватит горошины на всё лицо.',
    { h: 'Шаг 3. SPF — утром, всегда' },
    'Солнце — главная причина морщин, пигментных пятен и «уставшей» кожи. И это не только про лето: ультрафиолет проходит через облака и окна. SPF 30–50 утром последним слоем, вместо или поверх крема.',
    { q: 'Самый эффективный антивозрастной продукт — не дорогая сыворотка, а солнцезащитный крем.' },
    { h: 'А когда добавлять что-то ещё' },
    'Только когда база держится хотя бы 3–4 недели. Чёрные точки и прыщи — салициловая кислота (BHA) вечером 2–3 раза в неделю. Жирный блеск и расширенные поры — ниацинамид утром. Вводи по одному средству раз в 1–2 недели: если кожа отреагирует, будешь знать, на что.',
    { h: 'Частые ошибки' },
    'Тереть лицо полотенцем — промокай. Выдавливать прыщи — остаются пятна и рубцы. Менять средства каждую неделю — коже нужно 4–6 недель, чтобы показать результат. Спать на одной наволочке месяц — меняй раз в 3–4 дня.',
    'Через месяц такого ухода кожа выглядит ровнее и свежее — и это видно на фото «до/после». Никакой магии, только регулярность.'
  ] },
  { id: 'x2', wk: 0, tag: 'Стиль', img: 'street', art: 'a9', t: 'Капсульный гардероб: 15 вещей, которые закрывают всё', min: 9, body: [
    'Ощущение «нечего надеть» при забитом шкафе знакомо всем. Причина не в количестве вещей, а в том, что они не сочетаются между собой. Капсульный гардероб решает это: небольшой набор базовых вещей, где каждая сочетается почти с каждой.',
    { h: 'Правило трёх цветов' },
    'Основа капсулы — нейтральные цвета: чёрный, белый, серый, тёмно-синий, бежевый. Они сочетаются друг с другом без раздумий. Один-два акцентных цвета (оливковый, бордовый, горчичный) — максимум.',
    { h: 'Сам список' },
    'Верх: 3 плотные однотонные футболки (белая, чёрная, серая), 1 рубашка оксфорд (белая или голубая), 1 лонгслив или поло, 1 худи или свитшот без надписей, 1 тонкий свитер.',
    'Низ: прямые тёмные джинсы, чиносы (бежевые или оливковые), спортивные штаны прямого кроя «на выход».',
    'Верхняя одежда: куртка по сезону (бомбер, ветровка или пуховик без лишних деталей) и что-то поприличнее — пальто или овершот.',
    'Обувь: белые кожаные кеды, ботинки (челси или дерби), кроссовки для спорта.',
    { q: 'Пятнадцать вещей по размеру выглядят дороже, чем пятьдесят случайных.' },
    { h: 'Посадка важнее бренда' },
    'Шов плеча — на краю плеча. Футболка заканчивается на середине ширинки. Брюки не собираются гармошкой на обуви. Вещь, которая почти подходит, можно ушить у портного за 300–700 ₽ — и она начнёт выглядеть как дорогая.',
    { h: 'Как собрать без больших трат' },
    'Начни с ревизии: всё, что не носил год, плохо сидит или с огромными логотипами — в отдельный пакет. Потом закрой дыры из списка выше по одной вещи. Плотность футболки (от 200 г/м²) важнее надписи на бирке.',
    { h: 'Уход за вещами — половина стиля' },
    'Отпаренная рубашка и чистая обувь делают больше, чем новая куртка. Катышки снимаются машинкой за 300 ₽. Белые кеды чистятся зубной щёткой и пастой за 5 минут.',
    'Собери капсулу за месяц — и утром будешь одеваться за две минуты, выглядя при этом собранно каждый день.'
  ] },
  { id: 'x3', wk: 1, tag: 'Осанка', img: 'arms', art: 'a3', t: 'Осанка за 4 недели: почему сутулишься и как это исправить', min: 8, body: [
    'Сутулость — это не приговор и не генетика. В 9 из 10 случаев это привычка: часы за телефоном и компьютером, слабая спина и зажатая грудь. Хорошая новость — привычку можно переучить.',
    { h: 'Что происходит в теле' },
    'Когда ты долго сидишь, наклонившись вперёд, грудные мышцы укорачиваются и тянут плечи вперёд. Мышцы между лопатками растягиваются и слабеют. Голова уходит вперёд — и каждые 2–3 см наклона добавляют шее несколько килограммов нагрузки.',
    'Визуально сутулость съедает рост, делает живот больше, а самого человека — неуверенным. Ровная спина работает наоборот.',
    { h: 'Неделя 1–2: включить нужные мышцы' },
    'Каждый день: 2 минуты у стены (затылок, лопатки и ягодицы касаются стены, подбородок чуть к себе). Растяжка грудных в дверном проёме — 2 × 30 секунд. «Ангелы у стены» — 2 × 10 медленных повторов.',
    { h: 'Неделя 3–4: укрепить' },
    'Добавь тягу резинки к лицу (face pull) 3 × 15, «супермена» на полу 3 × 12 и австралийские подтягивания или тягу резинки к поясу. Это мышцы, которые держат плечи на месте.',
    { q: 'Мышцы держат осанку только тогда, когда они сильнее твоей привычки сутулиться.' },
    { h: 'Привычка важнее упражнений' },
    'Поставь 5 напоминаний в день: в этот момент выпрями спину, опусти плечи вниз и назад, подбородок к себе. Подними монитор до уровня глаз, телефон держи выше, а не на уровне живота.',
    { h: 'Чего не делать' },
    'Не «выпячивай» грудь колесом и не прогибай поясницу — это другая крайность. Не покупай корректоры осанки на весь день: мышцы расслабятся ещё сильнее. Если есть боль в спине, онемение рук — сначала к врачу.',
    'Через 4 недели сравни фото сбоку «до» и «после». Разница обычно заметна даже тем, кто ничего не знал о твоих стараниях.'
  ] },
  { id: 'x4', wk: 1, tag: 'Волосы', img: 'barber', art: 'a5', t: 'Как выбрать стрижку и не стесняться барбера', min: 7, body: [
    'Хорошая стрижка — самый быстрый апгрейд внешности. Она меняет впечатление за один час, и это видно сразу. Проблема в том, что большинство садится в кресло со словами «покороче» — и получает то же, что и всегда.',
    { h: 'Начни с типа волос' },
    'Прямые и тонкие — лучше короче по бокам и с текстурой сверху: длинные тонкие волосы ложатся плоско. Густые и жёсткие — можно оставить длину, они держат форму. Волнистые — не срезай всю длину: волна — твоё преимущество. Если волосы редеют — короткая стрижка смотрится аккуратнее, чем попытка что-то скрыть.',
    { h: 'Принеси фото — это нормально' },
    'Сохрани 3–5 фото стрижек на парнях с похожими волосами. Барберу так проще: «покороче» каждый понимает по-своему, а фото понимают все одинаково. Покажи, что нравится, и честно спроси: «Подойдёт ли это моим волосам?»',
    { h: 'Слова, которые помогут' },
    'Фейд (fade) — плавный переход от очень коротких висков к длине. Андеркат — резкий переход. Текстура — волосы сверху делают «рваными», чтобы легко укладывались. «Оставить длину сверху» — главная фраза, если не хочешь стрижку под ноль.',
    { q: 'Свежая стрижка раз в 3–4 недели даёт больше, чем любая новая вещь в гардеробе.' },
    { h: 'Укладка — это 2 минуты' },
    'Подсуши волосы феном, направляя их как хочешь. Возьми горошину матовой глины или пасты, разотри между ладонями до прозрачности и распредели от корней. Пудра для объёма — если волосы тонкие и падают.',
    'Совет: в конце стрижки попроси барбера показать, как он укладывает. Это бесплатный урок, который сэкономит месяцы экспериментов.'
  ] },
  { id: 'x5', wk: 2, tag: 'Сон', img: 'sleep', art: 'a13', t: 'Сон — бесплатный инструмент внешности', min: 7, body: [
    'Мешки под глазами, тусклая кожа, тяга к сладкому, ноль сил на тренировку — всё это часто не про косметику и не про лень, а про сон. Недосып бьёт по всему сразу.',
    { h: 'Что даёт нормальный сон' },
    'Во сне восстанавливаются мышцы после тренировки и вырабатываются гормоны, нужные для роста и восстановления. Кожа тоже восстанавливается ночью. А после недосыпа повышается аппетит, особенно на сладкое и жирное — это не слабость воли, а гормоны голода.',
    { h: 'Сколько нужно' },
    'Большинству взрослых — 7–9 часов. Ориентир простой: если просыпаешься без будильника в выходные на 2 часа позже обычного — ты недосыпаешь в будни.',
    { h: 'Как начать ложиться раньше' },
    'Не пытайся лечь на 2 часа раньше с завтрашнего дня — не уснёшь. Сдвигай отбой на 15–20 минут каждые несколько дней. Вставай в одно и то же время даже в выходные — это якорь для всего режима.',
    'За 30–60 минут до сна — без телефона в кровати. Дело не только в свете экрана: лента держит мозг в возбуждении. Положи телефон заряжаться в другой конец комнаты, а будильник поставь на часы.',
    { q: 'Хороший день начинается вечером накануне.' },
    { h: 'Спальня' },
    'Темно, прохладно (18–20 °C) и тихо. Маска для сна и беруши стоят копейки и решают половину проблем. Кофе — не позже чем за 8 часов до сна: кофеин держится в крови дольше, чем кажется.',
    'Попробуй неделю ложиться до полуночи — и сравни лицо утром на фото. Это самый дешёвый «уход», который существует.'
  ] },
  { id: 'x6', wk: 2, tag: 'Тело', img: 'gym', art: 'a4', t: 'Тело без зала: первые 8 недель дома', min: 9, body: [
    'Зал не обязателен, чтобы выглядеть лучше. Первые месяцы собственного веса, турника и резинок хватает с запасом — особенно если до этого ты почти не тренировался.',
    { h: 'Три тренировки в неделю' },
    'Понедельник, среда, пятница — или любые три дня с отдыхом между ними. Мышцы растут не на тренировке, а во время восстановления.',
    { h: 'Программа' },
    'Отжимания — 3–4 подхода почти до отказа. Если тяжело — от стола или с колен. Приседания — 3–4 × 15–25, медленно вниз. Подтягивания или австралийские (под столом) — 3–4 подхода. Выпады — 3 × 10 на каждую ногу. Планка — 3 × 30–60 секунд.',
    { h: 'Главное правило: прогрессия' },
    'Каждую неделю делай чуть больше: на 1–2 повтора, на один подход, медленнее опускайся. Если всё время делать одно и то же — тело быстро привыкает, и рост останавливается.',
    { q: 'Не нужно делать много. Нужно делать чуть больше, чем в прошлый раз.' },
    { h: 'Еда решает половину' },
    'Без белка мышцы не растут. Ориентир — белок в каждом приёме пищи: яйца, творог, курица, рыба, бобовые. Сладкую газировку и соки — убрать в первую очередь: это сотни пустых калорий.',
    { h: 'Чего ждать' },
    'Первые 2–3 недели — сила растёт быстрее, чем внешность: нервная система учится работать с мышцами. К 6–8 неделе изменения видно в зеркале и на фото: плечи, руки, осанка.',
    'Делай фото раз в неделю при одном и том же свете. Через два месяца сам удивишься.'
  ] },
  { id: 'x7', wk: 3, tag: 'Уход', img: 'mirror', art: 'a2', t: 'Прыщи: что реально работает, а что — деньги на ветер', min: 9, body: [
    'Прыщи бывают не только у подростков. И главное, что нужно о них знать: это не грязь и не «плохая кожа», а нормальный процесс, на который можно влиять.',
    { h: 'Откуда они берутся' },
    'Кожа производит кожное сало. Если поры забиваются ороговевшими клетками и салом — появляются чёрные точки и закрытые комедоны. Если туда добавляются бактерии и воспаление — красные прыщи.',
    { h: 'Что работает' },
    'Салициловая кислота (BHA) растворяет жир и чистит поры изнутри. Начинай с 2–3 раз в неделю вечером. Ниацинамид снижает жирность и успокаивает воспаления. Бензоилпероксид работает против бактерий — но может сушить и обесцвечивать ткань наволочки.',
    'И самое скучное, но важное: мягкое умывание, лёгкий крем и SPF. Агрессивное очищение делает только хуже.',
    { h: 'Что не работает' },
    'Спирт, зубная паста, лимон, соль, сода на лицо — раздражают кожу и усиливают воспаление. Скрабы с крупными частицами — травмируют. Выдавливание — оставляет пятна, которые держатся месяцами.',
    { q: 'Кислоты дают результат через 4–8 недель. Не через 4 дня.' },
    { h: 'Когда идти к дерматологу' },
    'Если прыщи глубокие и болезненные, оставляют рубцы, если за 2–3 месяца нормального ухода лучше не стало — это к врачу. Есть рецептурные средства, которые работают намного сильнее косметики. Это не стыдно, это быстрее.',
    { h: 'Образ жизни' },
    'Меняй наволочку раз в 3–4 дня, не трогай лицо руками, протирай экран телефона. У некоторых людей высыпания усиливаются от сладкого и молочного — понаблюдай за собой пару недель.',
    'Терпение и регулярность — вот и весь секрет. Через два месяца сравни фото.'
  ] },
  { id: 'x8', wk: 3, tag: 'Общение', img: 'portrait', art: 'a13', t: 'Уверенность без понтов: язык тела', min: 7, body: [
    'Люди составляют впечатление о тебе за первые секунды — и в основном не по словам, а по тому, как ты стоишь, смотришь и двигаешься. Хорошая новость: язык тела можно натренировать как мышцу.',
    { h: 'Занимай своё место' },
    'Неуверенный человек сжимается: плечи вперёд, руки скрещены, взгляд вниз. Уверенный — стоит ровно, плечи расправлены, руки свободно. Не нужно растопыриваться — просто не прячься.',
    { h: 'Взгляд' },
    'Смотри в глаза, когда говоришь и когда слушаешь. Не сверли — нормально отводить взгляд, задумываясь. Ориентир: смотришь в глаза примерно половину разговора.',
    { h: 'Медленнее' },
    'Суетливые движения и быстрая речь читаются как нервозность. Говори чуть медленнее, делай паузы, не бойся тишины. Паузы делают слова весомее.',
    { q: 'Уверенность — это не отсутствие страха. Это когда страх не управляет твоим телом.' },
    { h: 'Рукопожатие и улыбка' },
    'Рука — крепко, но не до хруста, 2–3 секунды, взгляд в глаза. Искренняя улыбка при знакомстве — самый дешёвый способ понравиться. Она работает почти на всех.',
    { h: 'Тренировка' },
    'Каждый день — одна маленькая социальная задача: поздороваться первым, задать вопрос продавцу, сделать комплимент. Именно поэтому в mogg есть миссии общения. Каждая маленькая победа делает следующую проще.'
  ] },
  { id: 'x9', wk: 4, tag: 'Уход', img: 'beard', art: 'a8', t: 'Борода и щетина: отращивать или брить', min: 6, body: [
    'Борода может сделать лицо мужественнее и скрыть то, что тебе не нравится. А может выглядеть неопрятно и добавить лет. Всё решает уход.',
    { h: 'Сначала проверь, как растёт' },

// Что почитать сегодня: в нечётные дни — следующий урок курса, в чётные — статья. Каждый день разное.
function readCard() {
  const n = dayNum(today()), rl = S.lessons || [], ra = S.articles || [];
  const lesson = ALL_LESSONS.find((l) => !rl.includes(l.id));
  const open = artsOpen(), fresh = open.filter((a) => isNewArt(a));
  const arts = open.filter((a) => !ra.includes(a.id)).sort((a, b) => b.min - a.min), pool = arts.length ? arts : open;
  // новая статья недели важнее урока; иначе чередуем урок и статью
  const isL = !fresh.length && !!lesson && (n % 2 === 1 || !arts.length);
  const it = isL ? lesson : fresh.length ? fresh[n % fresh.length] : pool[n % pool.length];
  if (!it) return '';
  const c = isL ? courseOf(it) : null, k = c ? c.lessons.indexOf(it) + 1 : 0;
  const ck = c ? Object.keys(COURSES).find((key) => COURSES[key] === c) : null;
  const more = open.filter((a) => a !== it && !ra.includes(a.id)).slice(0, 4);
  return `<div class="sec"><span class="disp">Почитать</span><span class="chipline">[ ${it.min} мин ]</span></div>
    <button class="feature" data-act="open" data-kind="${isL ? 'lesson' : 'article'}" data-id="${it.id}">${art(it.art, '', isL ? COURSE_IMG[ck] : it.img)}<div class="in"><span class="mono">[ ${c ? c.name + ' · урок ' + k : it.tag} · +${isL ? 25 : 5} XP ]${!isL && isNewArt(it) ? '<span class="newb">НОВОЕ</span>' : ''}</span><div class="disp" style="margin:8px 0 12px">${it.t}</div><span class="pillbtn" style="background:#fff;color:#000">Читать <i style="background:#000;color:#fff">${IC.arrow}</i></span></div></button>
    ${more.length ? `<div class="strip">${more.map((a) => `<button class="phcard" data-act="open" data-kind="article" data-id="${a.id}" style="text-align:left">${pic(a.img, 600)}<span class="mono">[ ${a.tag} · ${a.min} мин ]</span><div style="font-weight:800;font-size:17px;line-height:1.2;margin-top:4px">${a.t}</div></button>`).join('')}</div>` : ''}`;
}

// ---------- фото ----------
function readPhoto(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

    S.rdone = S.rdone || {}; S.rfull = S.rfull || {};
    const arr = S.rdone[key] = S.rdone[key] || [];
    withRankCheck(() => {
      const k = arr.indexOf(i); if (k >= 0) arr.splice(k, 1); else arr.push(i);
      if (st.every((s, j) => s.opt || arr.includes(j))) S.rfull[key] = 1; else delete S.rfull[key];
    });
    if (xp() > before) { floatXP('+10 XP'); confetti(); haptic('success'); toast(part === 'am' ? 'Утренний уход готов' : 'Вечерний уход готов'); } else haptic('light');
    save(); render();

  jtab(el) { jtab = el.dataset.v; haptic('light'); render(); const b = document.querySelector(`.jt [data-v="${jtab}"]`); b && b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); },
  'to-missions'() { const m = document.getElementById('missions'); m && m.scrollIntoView({ behavior: 'smooth' }); haptic('light'); },
  open(el) { reader = { kind: el.dataset.kind, id: el.dataset.id, t0: Date.now() }; haptic('light'); render(); const r = document.querySelector('.reader'); r && (r.scrollTop = 0); },
  'close-reader'() { reader = null; render(); },
  'mark-read'() {
    if (!readerReady()) return;
    const key = reader.kind === 'lesson' ? 'lessons' : 'articles';
    const before = xp();
    withRankCheck(() => {
      S[key] = S[key] || [];
      if (!S[key].includes(reader.id)) {
        S[key].push(reader.id);
        S.readAt = S.readAt || {}; S.readAt[reader.id] = today();
        const it = (reader.kind === 'lesson' ? ALL_LESSONS : ARTICLES).find((x) => x.id === reader.id);
        addEvent(reader.kind === 'lesson' ? 'lesson' : 'note', (reader.kind === 'lesson' ? 'Урок: ' : 'Прочитали: ') + it.t);
      }
    });
    const got = xp() - before;
    if (got) floatXP(`+${got} XP`); else toast('Засчитано. XP за чтение сегодня уже получен — приходи завтра');
    haptic('success');
    reader = null; save(); render();
  },
  'book-st'(el) {
    const id = el.dataset.id, v = el.dataset.v, b = BOOKS.find((x) => x.id === id);
    S.books = S.books || {};
    const before = xp();
    withRankCheck(() => {
      if (v === 'reading') Object.keys(S.books).forEach((k) => { if (S.books[k] === 'reading') S.books[k] = 'want'; });
      const was = S.books[id];
      S.books[id] = v;
      if (v === 'done' && was !== 'done') {
        addEvent('book', `Дочитали «${b.t}» · ${b.a}`); confetti(); haptic('success');
        if (xp() > before) floatXP('+50 XP'); else toast(`Отмечено. +50 XP придут, когда в трекере будет ${CAP.bookPages} страниц на каждую книгу`);
      }
      else if (v === 'reading') { toast('Книга добавлена в бонус-миссию'); haptic('medium'); }
      else haptic('light');
    });
    save(); render();
  },
  shop(el) {
    const it = S.plan.shopping[+el.dataset.i];
    const next = { none: 'ordered', ordered: 'arrived', arrived: 'none' }[it.st];
    it.st = next;
    if (next === 'ordered') addEvent('order', 'Заказали: ' + it.n);
    if (next === 'arrived') addEvent('arrived', 'Пришло: ' + it.n);
    if (next === 'none') S.events = S.events.filter((e) => !(e.date === today() && e.text.endsWith(it.n)));
    haptic('light'); save(); render();
  },
  quick(el) { sendChat(el.dataset.q); },
  'ask-summary'() { tab = 'coach'; render(); sendChat('Покажи мой путь'); },
  theme(el) {
    const k = el.dataset.v, need = themeLvl(k);
    if (rank().lvl < need) { haptic('light'); return toast(`Тема откроется на уровне ${need}`); }
    S.theme = k; haptic('light'); save(); lastScreen = ''; render();
  },
  accent(el) { S.accent = el.dataset.v; haptic('light'); save(); render(); },
  tone(el) { S.coachTone = el.dataset.v; modeOpen = false; haptic('light'); save(); render(); toast(`Режим: ${mode()[0]} ${mode()[1]}`); },
  'mode-toggle'() { modeOpen = !modeOpen; haptic('light'); render(); },
  'add-xp'() { withRankCheck(() => { S.bonus = (S.bonus || 0) + 300; }); floatXP('+300 XP'); save(); render(); },
  'skip-day'() { S.dayOffset = (S.dayOffset || 0) + 1; save(); render(); toast('Теперь день ' + dayNum(today())); },
  reset() {
    const go = () => { S = { theme: S.theme, accent: S.accent }; storedPhotos.clear(); photoDB.clear().catch(() => {}); save(); ob = freshOb(); tab = 'home'; reader = null; modal = null; render(); window.scrollTo(0, 0); };
    try { if (tg && tg.initData) return tg.showConfirm('Удалить весь прогресс?', (ok) => ok && go()); } catch (e) {}
    if (confirm('Удалить весь прогресс?')) go();
  }
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); } });
document.addEventListener('submit', (e) => { if (e.target.dataset.submit === 'chat') { e.preventDefault(); const i = document.getElementById('chatIn'); const v = i.value; i.value = ''; sendChat(v); } });
document.addEventListener('input', (e) => {
  const k = e.target.dataset.input;
  if (k === 'coach-name') { S.coachName = e.target.value.trim() || 'Макс'; save(); }
  if (k === 'goal') { const i = +e.target.dataset.i; S.sgoals = S.sgoals || []; S.sgoals[i] = { ...(S.sgoals[i] || {}), text: e.target.value }; save(); }
});
document.addEventListener('change', async (e) => {
  const kind = e.target.dataset.change, f = e.target.files && e.target.files[0];
  if (!kind || !f) return;
  try { await usePhoto(kind, await readPhoto(f)); } catch (err) { toast('Не получилось открыть фото'); }
});

// ---------- фото: камера или галерея ----------
// Telegram на Android игнорирует capture и открывает галерею, на iPhone — сразу камеру.
// Поэтому даём выбор сами, а камеру открываем прямо внутри приложения (если нельзя — камерой телефона).
let camStream = null, pui = null;
function pickFile(kind, cam) {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*'; i.style.display = 'none';
  if (cam) i.setAttribute('capture', 'user');
  i.onchange = async () => {
    const f = i.files && i.files[0]; i.remove();
    if (!f) return;
    try { await usePhoto(kind, await readPhoto(f)); } catch (e) { toast('Не получилось открыть фото'); }
  };
  document.body.appendChild(i); i.click();
}
function camStop() { if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
function closePhotoUI() { camStop(); const w = document.getElementById('photoUI'); if (w) w.remove(); pui = null; }
function photoSheet(kind) {
  closePhotoUI();
  pui = { kind, facing: 'user' };
  const w = document.createElement('div');
  w.id = 'photoUI'; w.className = 'modal';
  w.innerHTML = `<div class="sheet"><span class="mono">[ фото ]</span>
    <div class="disp" style="font-size:28px;margin:6px 0 4px">Откуда берём?</div>
    <div class="hint" style="margin-bottom:18px">Дневной свет, лицо прямо, без фильтров</div>
    <button class="btn" data-p="cam">📸 Сделать фото</button>
    <button class="btn ghost" data-p="gal" style="margin-top:10px">🖼 Выбрать из галереи</button>
    <button class="btn ghost" data-p="x" style="margin-top:10px;background:none;border:0;height:44px;color:var(--hint)">Отмена</button></div>`;
  w.addEventListener('click', photoClick);
  document.body.appendChild(w);
  haptic('light');
}
function photoClick(e) {
  const w = document.getElementById('photoUI'), b = e.target.closest('[data-p]');
  if (!pui || !w) return;
  if (!b) { if (e.target === w) closePhotoUI(); return; }
  const kind = pui.kind, p = b.dataset.p;
  if (p === 'x') closePhotoUI();
  else if (p === 'gal') { closePhotoUI(); pickFile(kind, false); }
  else if (p === 'native') { closePhotoUI(); pickFile(kind, true); }
  else if (p === 'cam') camOpen();
  else if (p === 'flip') { pui.facing = pui.facing === 'user' ? 'environment' : 'user'; haptic('light'); camStart(); }
  else if (p === 'snap') camSnap();
}
function camOpen() {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) { const k = pui.kind; closePhotoUI(); return pickFile(k, true); }
  const w = document.getElementById('photoUI');
  w.className = 'cam';
  w.innerHTML = `<video id="camV" playsinline autoplay muted></video><div class="cam-oval"></div>
    <div class="cam-top"><button class="cam-b" data-p="x" aria-label="Закрыть">✕</button><span class="mono">лицо в овал · дневной свет</span><button class="cam-b" data-p="flip" aria-label="Сменить камеру">⟲</button></div>
    <div class="cam-bot"><button class="cam-shot" data-p="snap" aria-label="Сделать снимок"></button></div>
    <div class="cam-err" hidden></div>`;
  camStart();
}
async function camStart() {
  camStop();
  const me = pui;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: me.facing, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    const v = document.getElementById('camV');
    if (pui !== me || !v) { s.getTracks().forEach((t) => t.stop()); return; } // окно уже закрыли
    camStream = s; v.srcObject = s; v.classList.toggle('mirror', me.facing === 'user');
    v.play().catch(() => {});
  } catch (err) {
    const er = document.querySelector('#photoUI .cam-err');
    if (!er) return;
    document.querySelectorAll('#photoUI .cam-bot, #photoUI .cam-oval, #photoUI [data-p=flip]').forEach((x) => { x.style.display = 'none'; });
    er.hidden = false;
    er.innerHTML = `<div style="font-weight:800;font-size:17px">Камера внутри не открылась</div>
      <div class="hint" style="margin:6px 0 16px">${err && err.name === 'NotAllowedError' ? 'Нет разрешения на камеру. ' : ''}Можно снять обычной камерой телефона.</div>
      <button class="btn" data-p="native">📸 Камера телефона</button>
      <button class="btn ghost" data-p="gal" style="margin-top:10px">🖼 Из галереи</button>`;
  }
}
function camSnap() {
  const v = document.getElementById('camV');
  if (!v || !v.videoWidth) return;
  const k = Math.min(1, 600 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  const x = c.getContext('2d');
  if (pui.facing === 'user') { x.translate(c.width, 0); x.scale(-1, 1); } // как в зеркале — так, как человек себя видел
  x.drawImage(v, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', 0.78), kind = pui.kind;
  haptic('medium'); closePhotoUI();
  usePhoto(kind, data).catch(() => toast('Не получилось сохранить фото'));
}

async function usePhoto(kind, data) {
  {
    if (kind === 'ob-photo') { ob.photo = data; ob.photoErr = null; render(); }
    if (kind === 'ai-photo') {
      if (aiBusy) return;
      aiBusy = true; aiPhoto = data; render();
      const a = await aiCall('analyze', { photo: data, issues: S.issues || [], tone: S.coachTone || 'soft' }, 90000);
      aiBusy = false;
      if (a.error) { toast(aiErr(a.error)); render(); return; }
      if (!a.person || a.quality === 'bad') { modal = { kind: 'ai-bad', note: !a.person ? 'На фото не видно человека.' : a.quality_note || 'Фото тёмное или размытое.' }; render(); return; }
      applyAI(a);
    }
    if (kind === 'week-photo') { withRankCheck(() => { S.photos.push({ date: today(), data }); addEvent('photo', 'Фото прогресса'); }); save(); render(); floatXP('+15 XP'); haptic('success'); }
  }
}

// Запуск: сначала то, что есть в телефоне, потом сверяемся с облаком Telegram
function start() {
  let shown = false;
  const show = () => { if (shown) return; shown = true; render(); hydratePhotos(); };
  // Телефон пустой (новое устройство или память почистили) — даём облаку пару секунд, чтобы не показать онбординг зря
  if (S.onboarded || !cloud.ok) show();
  else setTimeout(show, 2500);
  cloud.pull().then((c) => {
    if (c && (c._ts || 0) > (S._ts || 0)) {
      const local = S.photos || [];
      S = c;
      S.photos = (S.photos || []).map((p) => local.find((l) => l.id === p.id) || p);
      S.photos.forEach((p) => { if (!p.data) storedPhotos.add(p.id); });
      persistLocal();
      if (shown) { render(); hydratePhotos(); } else show();
    } else {
      if ((S._ts || 0) > ((c && c._ts) || 0)) cloud.schedule();
      show();
    }
  }).catch(show).then(() => { if (S.onboarded) track('open', { day: dayNum(today()) }); });
}
start();
</script>
