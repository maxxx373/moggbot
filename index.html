.st-cover .st-card::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.72))}
.st-cover .disp{font-size:clamp(34px,10.5vw,46px);text-wrap:balance}
.st-cover .mono{color:rgba(255,255,255,.8)}
.st-swipe{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:16px;height:40px;padding:0 16px;border-radius:20px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13.5px;animation:stnudge 1.6s ease-in-out infinite}
@keyframes stnudge{50%{transform:translateX(7px)}}
.st-swipe svg{width:16px;height:16px;transform:rotate(45deg)}
.st-end .st-card{justify-content:center}
.st-end ul{list-style:none;margin:14px 0 22px;padding:0;display:flex;flex-direction:column;gap:10px}
.st-end li{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15.5px;line-height:1.3}
.st-end li::before{content:'';flex:none;width:14px;height:14px;margin-top:3px;background:var(--accent);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.st-nav{flex:none;max-width:520px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px calc(14px + env(safe-area-inset-bottom))}
.st-nav .arrow{width:48px;height:48px}
.st-nav .arrow svg{width:18px;height:18px}
.st-nav .arrow:first-child svg{transform:rotate(-135deg)}
.st-nav .arrow:last-child svg{transform:rotate(45deg)}
.st-nav button[disabled]{opacity:.3;pointer-events:none}
.st-nav .mono{font-size:12px}

/* ---------- обложки «Почитать»: градиент-аура, зерно и крупный стикер вместо стоковых фото ---------- */
.cov{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(75% 60% at 12% 8%,var(--k1),transparent 62%),radial-gradient(70% 65% at 95% 28%,var(--k2),transparent 60%),
  radial-gradient(90% 70% at 40% 105%,var(--k3),transparent 65%),var(--k0)}
.cov::before{content:'';position:absolute;left:-20%;top:22%;width:140%;height:52%;border:1px solid rgba(255,255,255,.4);border-radius:50%;transform:rotate(-16deg)}
.cov::after{content:'';position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.55;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>")}
.cov-em{position:absolute;right:7%;top:15%;font-size:clamp(96px,36vw,150px);line-height:1;transform:rotate(-10deg);font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 16px 18px rgba(0,0,0,.35));animation:covfloat 5s ease-in-out infinite alternate}
@keyframes covfloat{from{transform:rotate(-10deg) translateY(-5px)}to{transform:rotate(-4deg) translateY(7px)}}
/* большая карточка как пост-карусель 4:5 */
:root .feature.ig{aspect-ratio:4/5;min-height:0;padding:14px;justify-content:space-between;border-radius:32px;box-shadow:0 30px 40px -24px color-mix(in srgb,var(--k2,#8b5cff) 80%,transparent)}
:root .feature.ig::after{display:none}
.feature.ig .cov{inset:-6% 0}
.ig-top{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px}
.ig-pill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#fff;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ig-pill.xp{background:#fff;color:#07080c;border-color:#fff}
.ig-pill.new{background:var(--hot);border-color:var(--hot)}
.ig-glass{position:relative;z-index:2;border-radius:24px;padding:16px;text-align:left;background:rgba(8,9,13,.4);border:1px solid rgba(255,255,255,.24);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.feature.ig .ig-glass .disp{font-size:clamp(26px,8.2vw,36px);line-height:.98;text-wrap:balance}
.ig-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ig-dots{display:flex;gap:5px}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.ig-dots i.on{background:#fff;width:18px;border-radius:6px}
/* карточки в ленте и в читалке */
:root .phcard::after{display:none}
.phcard > .cov{position:absolute;inset:0;z-index:0}
.phcard .cov-em{font-size:74px;right:8%;top:10%}
.phcard{border-radius:28px}
.phcard::before{background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.6))}
.acard .thumb .cov-em{font-size:46px;right:auto;left:50%;top:50%;margin:-28px 0 0 -26px}
.acard .thumb .cov::before{display:none}
.st-cover .cov{z-index:0}
.st-cover .cov-em{font-size:clamp(120px,44vw,190px);right:6%;top:9%}
:root .st-cover .st-card::after{display:none}
:root .card.libtile[data-v="perfume"]{grid-column:span 2;min-height:124px;
  background:radial-gradient(70% 90% at 100% 0%,#ff4fd8,transparent 60%),radial-gradient(70% 90% at 0% 100%,#2f6bff,transparent 60%),#3a1a8a}
.libtile[data-v="perfume"] .ic{position:absolute;right:16px;top:10px;font-size:64px;transform:rotate(-10deg);filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.libtile[data-v="perfume"] small{color:rgba(255,255,255,.8)}

/* ---------- парфюм: подбор и результат ---------- */
:root .card.pf-start{background:radial-gradient(80% 90% at 100% 0%,#ff4fd8,transparent 60%),radial-gradient(70% 90% at 0% 100%,#2f6bff,transparent 62%),#2a1470;box-shadow:0 26px 34px -22px #6a3dff}
.pf-start .hint{color:rgba(255,255,255,.85)}
:root .pf-chips{gap:9px;margin-bottom:16px}
:root .pf-chips .chip{padding:13px 16px;font-size:15px;border-radius:18px}
:root .card.pf-fact{margin-top:4px;background:radial-gradient(90% 80% at 100% 0%,#6f8dff,transparent 60%),#2a4ae0;box-shadow:0 22px 30px -20px rgba(20,40,160,.8);animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.pf-fact .mono{color:rgba(255,255,255,.8)}
.pf-fact p{margin:8px 0 10px;font-size:15.5px;line-height:1.5;font-weight:600}
:root .card.pf-fact .buy{background:#fff;color:#07080c;border:0;margin:0}
.pfc{position:relative;overflow:hidden}
:root .card.pf-hero{background:radial-gradient(90% 70% at 100% 0%,color-mix(in srgb,var(--pc) 40%,transparent),transparent 62%),var(--dk);box-shadow:0 0 0 1.5px var(--pc),0 26px 34px -22px color-mix(in srgb,var(--pc) 70%,transparent)}
.pf-pct{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1;padding:7px 11px;border-radius:12px;color:#07080c;
  background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#fff));box-shadow:0 0 18px -2px var(--pc)}
.pf-notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pf-notes span{padding:5px 10px;border-radius:10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.pf-why{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.4}
.pf-why li{display:flex;gap:9px;align-items:flex-start}
.pf-why li::before{content:'';flex:none;width:12px;height:12px;margin-top:3px;background:var(--pc,var(--accent));clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
:root .buy:nth-child(3n+1){background:#005bff;color:#fff;border-color:transparent}
:root .buy:nth-child(3n+2){background:#cb11ab;color:#fff;border-color:transparent}
:root .buy:nth-child(3n+3){background:#ffcc00;color:#07080c;border-color:transparent}
:root .btn.ghost[data-act="pf-back"]::before{display:none}
.buy{text-decoration:none}
.ob-fill{display:flex;flex-direction:column;min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
.ob-bottom{margin-top:auto;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.ob-link{display:block;margin:14px auto 0;text-align:center;font-weight:700;font-size:13.5px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}

/* ---------- ещё больше цвета на кнопках ---------- */
/* градиент на кнопке теперь из трёх цветов и медленно течёт */
:root .btn:not(.ghost){--b3:var(--bc3,color-mix(in srgb,var(--accent) 35%,#1fdcff));
  background:linear-gradient(110deg,var(--b1),var(--b2),var(--b3),var(--b1)) 0 0/300% 100%;animation:btnflow 7s linear infinite}
:root .btn:not(.ghost):not(.sm):not([disabled]){animation:btnflow 7s linear infinite,btnglow 2.2s ease-in-out infinite}
@keyframes btnflow{to{background-position:300% 0}}
:root .btn:is([data-act="analyze"],[data-act="photo"],[data-act="ai-open"],[data-act="lib"],[data-p="cam"],[data-p="native"],[data-p="gal"]){--bc3:#1fdcff}
:root .btn:is([data-act="wo-go"],[data-act="wo-close"],[data-act="focus-toggle"],[data-act="focus-open"],[data-act="ex-open"],[data-act="skip-day"]){--bc3:#ffb23d}
:root .btn:is([data-act="ask-summary"],[data-act="grat"],[data-act="mode-toggle"],[data-act="go"]){--bc3:#2f6bff}
:root .btn:is([data-act="pro-pay"],[data-act="pro-open"],[data-act="claim"],[data-act="add-xp"]){--bc3:#8b5cff}
:root .btn:is([data-act="pages"],[data-act="rem-hour"],[data-act="book-st"]){--bc3:#2f6bff}
:root .btn:is([data-act="proto-finish"],[data-act="proto-add"],[data-act="accept"]){--bc3:#1fdcff}
:root .btn:is([data-act="modal-close"],[data-act="wo-close"]):not(.ghost){--bc:#ffd21a;--bc2:#ff8a1c;--bc3:#ff4fa3;--bt:#2a1300}
:root .btn[data-act="mark-read"]{--bc:#22e08a;--bc2:#1fdcff;--bc3:#d4ff1a;--bt:#03230f}
:root .btn:is([data-act="pf-start"],[data-act="pf-next"]){--bc:#ff4fa3;--bc2:#8b5cff;--bc3:#2f6bff;--bt:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
:root .btn[data-act="pf-again"]{--bc:#ff4fa3;--bc2:#8b5cff}
/* «призрачные» кнопки: лёгкая цветная заливка и цветная рамка */
:root .btn.ghost[data-act]:not([data-act="modal-close"],[data-act="close-reader"],[data-act="focus-close"],[data-act="rem-no"],[data-act="rem-off"],[data-act="reset"],[data-act="proto-drop"]),:root .btn.ghost[data-p="gal"]{
  background:color-mix(in srgb,var(--bc,var(--accent)) 16%,var(--card));border-color:color-mix(in srgb,var(--bc,var(--accent)) 60%,transparent)}
/* чипы: шесть цветов по кругу, цвет виден и до выбора */
:root .chips .chip{--cc:var(--accent);--cc2:#2bffa0;--ct:#06101c;border:1.5px solid color-mix(in srgb,var(--cc) 65%,transparent);box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 45%,transparent)}
:root .chips .chip:nth-child(6n+2){--cc:#2f6bff;--cc2:#8a4dff;--ct:#fff}
:root .chips .chip:nth-child(6n+3){--cc:#ff5a1c;--cc2:#ff2d87;--ct:#fff}
:root .chips .chip:nth-child(6n+4){--cc:#8b5cff;--cc2:#ff4fd8;--ct:#fff}
:root .chips .chip:nth-child(6n+5){--cc:#1fdcff;--cc2:#3dffc0;--ct:#02222b}
:root .chips .chip:nth-child(6n+6){--cc:#ffd21a;--cc2:#ff8a1c;--ct:#2a1300}
:root .chips .chip.on,:root :is(.card,.sheet) .chips .chip.on{background:linear-gradient(135deg,var(--cc),var(--cc2));color:var(--ct);border-color:transparent;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 color-mix(in srgb,var(--cc) 50%,#000),0 12px 20px -8px var(--cc);transform:translateY(-2px)}
/* вкладки библиотеки и переключатели */
:root .jt button{--jc:#2f6bff;--jc2:#8a4dff;border:1.5px solid color-mix(in srgb,var(--jc) 55%,transparent)}
:root .jt button:nth-child(6n+2){--jc:#ff5a1c;--jc2:#ff2d87}
:root .jt button:nth-child(6n+3){--jc:#8b5cff;--jc2:#ff4fd8}
:root .jt button:nth-child(6n+4){--jc:#12c9a0;--jc2:#1fdcff}
:root .jt button:nth-child(6n+5){--jc:#ff4fa3;--jc2:#ffb23d}
:root .jt button:nth-child(6n+6){--jc:#e0a800;--jc2:#ff8a1c}
:root .jt button.on{background:linear-gradient(135deg,var(--jc),var(--jc2));color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -6px var(--jc)}
:root .backlink{background:linear-gradient(135deg,#8b5cff,#ff4fd8);color:#fff;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -8px #8b5cff}
/* миссии: у каждой свой цвет награды и кружка */
:root .sec + .mission{--mc:var(--accent);--mc2:#2bffa0;--mt:#06101c}
:root .sec + .mission + .mission{--mc:#1fdcff;--mc2:#2f6bff;--mt:#fff}
:root .sec + .mission + .mission + .mission{--mc:#ff5a1c;--mc2:#ff2d87;--mt:#fff}
:root .mission:not(.charm):not(.bonus) .xp{background:linear-gradient(135deg,var(--mc,var(--accent)),var(--mc2,#2bffa0));color:var(--mt,var(--on-accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 14px -2px var(--mc,var(--accent))}
:root .mission:not(.done) .box{border-color:var(--mc,currentColor);border-width:2px;opacity:1}
:root .mission.charm:not(.done) .box{border-color:#8b5cff}
:root .mission.bonus:not(.done) .box{border-color:#1fdcff}
/* варианты с галочкой */
:root .opt:not(.on) .box{border-color:var(--blue);border-width:2px}
:root .opt.on{box-shadow:0 0 0 2px var(--accent),0 12px 22px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
:root .sec .chipline{color:var(--sc,#8fa6ff)}

/* ---------- цвет везде, где можно нажать ---------- */
/* у каждого блока экрана свой цвет: он красит круглую кнопку, фон карточки-строки и иконку */
:root .app > :nth-child(4n+1){--kc:#ff5a1c;--kc2:#ff2d87}
:root .app > :nth-child(4n+2){--kc:#8b5cff;--kc2:#ff4fd8}
:root .app > :nth-child(4n+3){--kc:#12c9a0;--kc2:#1fdcff}
:root .app > :nth-child(4n+4){--kc:#2f6bff;--kc2:#8a4dff}
:root .app > button.card.row,:root .app > button.card:not(.libtile):not(.wocard):not(.procard){
  background:linear-gradient(115deg,color-mix(in srgb,var(--kc) 55%,transparent) 0%,color-mix(in srgb,var(--kc2) 22%,transparent) 42%,transparent 72%),var(--dk);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1.5px color-mix(in srgb,var(--kc) 60%,transparent),0 22px 30px -18px color-mix(in srgb,var(--kc) 75%,transparent)}
:root .app > button.card .iconbtn{--kc:#fff;color:#07080c;background:radial-gradient(120% 120% at 30% 18%,#fff 0,#eef0f5 55%,#c9ced9 100%);border-color:transparent}
/* неактивные чипы и вкладки: мягкая заливка своим цветом */
:root .chips .chip:not(.on){background:color-mix(in srgb,var(--cc) 20%,var(--card))}
:root .jt button:not(.on){background:color-mix(in srgb,var(--jc) 18%,var(--card))}
:root .seg button:not(.on){color:var(--text)}
:root .seg{background:linear-gradient(135deg,color-mix(in srgb,#2f6bff 18%,var(--card)),color-mix(in srgb,#ff4fd8 18%,var(--card)))}
/* белые кнопки тоже цветные: заливка сильнее, рамка в цвет */
:root .btn.ghost{background:color-mix(in srgb,var(--bc,#8b5cff) 14%,var(--card));border:1.5px solid color-mix(in srgb,var(--bc,#8b5cff) 55%,transparent)}
:root .btn.ghost[data-act]:not([data-act="modal-close"],[data-act="close-reader"],[data-act="focus-close"],[data-act="rem-no"],[data-act="rem-off"],[data-act="reset"],[data-act="proto-drop"]),:root .btn.ghost[data-p="gal"]{
  background:linear-gradient(135deg,color-mix(in srgb,var(--bc,var(--accent)) 30%,var(--card)),color-mix(in srgb,var(--bc2,var(--bc,var(--accent))) 30%,var(--card)));border-color:color-mix(in srgb,var(--bc,var(--accent)) 75%,transparent)}
:root .btn.ghost[data-act="reset"]{--bc:#ff4a4a}
/* варианты с галочкой: четыре цвета по кругу */
:root .opt{--oc:#2f6bff;background:color-mix(in srgb,var(--oc) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--oc) 45%,transparent)}
:root .opt:nth-of-type(4n+2){--oc:#ff5a1c}
:root .opt:nth-of-type(4n+3){--oc:#8b5cff}
:root .opt:nth-of-type(4n+4){--oc:#12c9a0}
:root .opt:not(.on) .box{border-color:var(--oc)}
:root .opt.on{background:color-mix(in srgb,var(--oc) 24%,var(--card));box-shadow:0 0 0 2px var(--oc),0 12px 22px -10px var(--oc)}
:root .opt.on .box{background:linear-gradient(135deg,var(--oc),color-mix(in srgb,var(--oc) 55%,#fff));border-color:transparent;color:#fff}
/* миссии: цветная полоса слева и лёгкий оттенок фона */
:root .mission:not(.done){background:linear-gradient(100deg,color-mix(in srgb,var(--mc,var(--accent)) 22%,var(--card)),var(--card) 60%);box-shadow:inset 5px 0 0 var(--mc,var(--accent)),var(--neu)}
:root .mission.charm:not(.done){--mc:#8b5cff}
:root .mission.bonus:not(.done){--mc:#1fdcff}
:root :is(.card,.sheet) .mission:not(.done){box-shadow:inset 5px 0 0 var(--mc,var(--accent))}
/* плитки библиотеки: фото в цвете плитки вместо серого */
:root .card.libtile{--lc:#2f6bff;--lc2:#8a4dff;background:linear-gradient(150deg,var(--lc),color-mix(in srgb,var(--lc2) 60%,#000) 85%);box-shadow:0 20px 28px -18px var(--lc)}
:root .libgrid .libtile:nth-child(6n+2){--lc:#ff5a1c;--lc2:#ff2d87}
:root .libgrid .libtile:nth-child(6n+3){--lc:#12c9a0;--lc2:#1f8cff}
:root .libgrid .libtile:nth-child(6n+4){--lc:#8b5cff;--lc2:#ff4fd8}
:root .libgrid .libtile:nth-child(6n+5){--lc:#e0a800;--lc2:#ff5a1c}
:root .libgrid .libtile:nth-child(6n+6){--lc:#ff4fa3;--lc2:#8b5cff}
:root .libgrid .libtile:nth-child(6n+7){--lc:#1fb8e0;--lc2:#2f6bff}
:root .libtile img.lt{mix-blend-mode:luminosity;opacity:.38;filter:grayscale(1) contrast(1.15)}
:root .libtile small{color:rgba(255,255,255,.85)}
/* плитки тренировок, уровень, «Читать», чип секции */
:root .wotile{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 35%,#000) 90%);box-shadow:0 18px 24px -16px var(--c)}
:root .wotile small{color:rgba(255,255,255,.85)}
:root .lvl{background:linear-gradient(135deg,#2f6bff,#8b5cff 55%,#ff4fd8);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 16px -8px #8b5cff}
:root .lvl em{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.7)}

<script>
// Адрес бэкенда с настоящей нейросетью (Yandex Cloud Functions). Пусто — тренер работает на локальных правилах.
const AI_ENDPOINT = 'https://functions.yandexcloud.net/d4ed49e9mdk8mqm9i4if';

const tg = window.Telegram && window.Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); } catch (e) {}
// Без этого в Telegram свайп вниз при прокрутке сворачивает приложение
try { tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
const tgUser = (() => { try { return tg.initDataUnsafe.user || null; } catch (e) { return null; } })();
// Тестовые кнопки видны только по ссылке с ?dev=1
const DEV = /[?&]dev=1/.test(location.search);
const haptic = (type) => { try { if (type === 'success') tg.HapticFeedback.notificationOccurred('success'); else tg.HapticFeedback.impactOccurred(type || 'light'); } catch (e) {} };
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

// Яндекс Метрика: номер счётчика с metrika.yandex.ru. 0 — статистика выключена.
// По ссылке с ?dev=1 статистика не пишется, чтобы твои тесты не портили цифры.
const YM_ID = 114017851;
if (YM_ID && !DEV) {
  (function (m, e, t, r, i, k, a) { m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); }; m[i].l = 1 * new Date(); k = e.createElement(t); a = e.getElementsByTagName(t)[0]; k.async = 1; k.src = r; a.parentNode.insertBefore(k, a); })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
  // Вебвизор выключен: он записывал бы экран вместе с фото
  ym(YM_ID, 'init', { clickmap: false, trackLinks: false, accurateTrackBounce: true, webvisor: false });
  // ID из Telegram — чтобы один и тот же человек считался одним, даже если телефон почистил память
  if (tgUser && tgUser.id) ym(YM_ID, 'userParams', { UserID: String(tgUser.id) });
}
const track = (goal, params) => { try { if (YM_ID && !DEV) ym(YM_ID, 'reachGoal', goal, params); } catch (e) {} };

// ---------- хранилище ----------
// Прогресс: localStorage (быстро) + Telegram CloudStorage (переживает чистку памяти и смену телефона).
// Фото: IndexedDB — там места в разы больше, и тяжёлые картинки не мешают сохранять прогресс.
const KEY = 'upgrade_v3';
let S = load();
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }

const photoDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('mogg_photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('p', mode), r = fn(t.objectStore('p'));
    t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error);
  }));
  return {
    put: (id, data) => tx('readwrite', (s) => s.put(data, id)),
    get: (id) => tx('readonly', (s) => s.get(id)),
    clear: () => tx('readwrite', (s) => s.clear())
  };
})();
// Фото, которые точно лежат в IndexedDB: в localStorage для них храним только id и дату
const storedPhotos = new Set((S.photos || []).filter((p) => p.id && !p.data).map((p) => p.id));
const newPhotoId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const leanPhotos = (all) => (S.photos || []).map((p) => (all || storedPhotos.has(p.id) ? { id: p.id, date: p.date } : p));

function persistLocal() {
  try { localStorage.setItem(KEY, JSON.stringify({ ...S, photos: leanPhotos() })); }
  catch (e) {
    // Места нет: сохраняем прогресс хотя бы без картинок, чтобы не потерять XP и миссии
    try { localStorage.setItem(KEY, JSON.stringify({ ...S, photos: leanPhotos(true) })); } catch (e2) {}
    toast('Память телефона заполнена — часть фото может не сохраниться');
  }
}
function save() {
  S._ts = Date.now();
  (S.photos || []).forEach((p) => {
    if (!p.id) p.id = newPhotoId();
    if (p.data && !storedPhotos.has(p.id)) {
      photoDB.put(p.id, p.data).then(() => { storedPhotos.add(p.id); persistLocal(); }).catch(() => {});
    }
  });
  persistLocal();
  cloud.schedule();
}
// Подтянуть картинки из IndexedDB после запуска
function hydratePhotos() {
  const miss = (S.photos || []).filter((p) => p.id && !p.data);
  if (!miss.length) return;
  Promise.all(miss.map((p) => photoDB.get(p.id).then((d) => { if (d) { p.data = d; storedPhotos.add(p.id); } }).catch(() => {}))).then(() => render());
}

// Облако Telegram: до 1024 ключей по 4096 символов. Режем прогресс на куски, фото туда не кладём.
const cloud = (() => {
  const cs = (() => { try { return tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage ? tg.CloudStorage : null; } catch (e) { return null; } })();
  const CH = 4000;
  const call = (m, ...a) => new Promise((res, rej) => { try { cs[m](...a, (err, v) => (err ? rej(err) : res(v))); } catch (e) { rej(e); } });
  let timer = null, busy = false, again = false, lastN = 0;
  async function push() {
    if (busy) { again = true; return; }
    busy = true;
    try {
      const str = JSON.stringify({ ...S, photos: leanPhotos(true) });
      const parts = [];
      for (let i = 0; i < str.length; i += CH) parts.push(str.slice(i, i + CH));
      await Promise.all(parts.map((p, i) => call('setItem', 'c' + i, p)));
      await call('setItem', 'm', JSON.stringify({ n: parts.length, ts: S._ts || 0 }));
      // Хвост от прошлой, более длинной версии больше не нужен
      if (lastN > parts.length) await call('removeItems', Array.from({ length: lastN - parts.length }, (_, i) => 'c' + (parts.length + i)));
      lastN = parts.length;
    } catch (e) {}
    busy = false;
    if (again) { again = false; push(); }
  }
  return {
    ok: !!cs,
    schedule() { if (!cs) return; clearTimeout(timer); timer = setTimeout(push, 1500); },
    flush() { if (!cs || !timer) return; clearTimeout(timer); timer = null; push(); },
    async pull() {
      if (!cs) return null;
      const meta = JSON.parse((await call('getItem', 'm')) || 'null');
      if (!meta || !meta.n) return null;
      lastN = meta.n;
      const keys = Array.from({ length: meta.n }, (_, i) => 'c' + i);
      const vals = await call('getItems', keys);
      const data = JSON.parse(keys.map((k) => vals[k] || '').join(''));
      return data && data._ts === meta.ts ? data : null;
    }
  };
})();

// Дроп обновляется 3 раза в день; порядок свой у каждого пользователя и не повторяется, пока не пройдёт вся база
const DROP_SLOTS = [[0, 'утро'], [12, 'день'], [18, 'вечер']];
function dropNow() {
  const t = now(), h = t.getHours(), slot = h >= 18 ? 2 : h >= 12 ? 1 : 0;
  const idx = (dayNum(today()) - 1) * DROP_SLOTS.length + slot;
  // перемешиваем базу детерминированно от даты старта — у каждого свой порядок
  let seed = [...(S.startDate || 'x')].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0;
  const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  const order = DROPS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const next = slot < 2 ? DROP_SLOTS[slot + 1][0] : 24;
  const mins = (next - h) * 60 - t.getMinutes();
  return { n: idx + 1, text: DROPS[order[idx % order.length]], slot: DROP_SLOTS[slot][1], left: mins >= 60 ? `${Math.floor(mins / 60)} ч ${mins % 60} мин` : `${mins} мин` };
}

  { id: 'l2', t: 'Почему ты не нравишься себе на фото', min: 3, art: 'a2', body: [

  { id: 'l4', t: 'Перестань сравнивать', min: 2, art: 'a4', body: [

const MIND = [
  { id: 'm1', t: 'Держи слово', min: 2, art: 'a12', body: [

  { id: 'm2', t: 'Без оправданий', min: 2, art: 'a5', body: [

  { id: 'm3', t: 'Сила — в уважении', min: 2, art: 'a3', body: [

const CAT_BY = Object.fromEntries(CATALOG.map((x) => [x.id, x]));
const tierOf = (p) => p <= 700 ? 1 : p <= 1600 ? 2 : 3;
// Потолок цены одного средства исходя из бюджета анкеты
const priceCap = (b) => b >= 5000 ? 99999 : b >= 3000 ? 2500 : b >= 1500 ? 1600 : b > 0 ? 700 : 500;
// Лучшее средство под задачу: подходит под проблемы, влезает в бюджет, самое сильное из доступных
function bestFor(slot, issues, budget) {
  const cap = priceCap(budget), list = CATALOG.filter((x) => x.slot === slot);
  const fit = (x) => !x.for || !x.for.length || x.for.some((i) => issues.includes(i));
  const ok = list.filter((x) => x.p <= cap && fit(x)).sort((a, b) => (b.for ? b.for.filter((i) => issues.includes(i)).length : 0) - (a.for ? a.for.filter((i) => issues.includes(i)).length : 0) || b.p - a.p);
  return ok[0] || list.filter((x) => fit(x)).sort((a, b) => a.p - b.p)[0] || null;
}
// Средство юзера под задачу: то, что уже в его списке покупок, иначе лучшее под бюджет
function myPick(slot) {
  const it = ((S.plan && S.plan.shopping) || []).find((s) => s.slot === slot && s.pid && CAT_BY[s.pid]);
  return it ? CAT_BY[it.pid] : bestFor(slot, S.issues || [], S.budget || 0);
}
const shopLinks = (x) => {
  const q = encodeURIComponent((x.b && !/^(База|Спорт|Сон|Любой)/.test(x.b) ? x.b + ' ' : '') + x.n);
  return [['Ozon', 'https://www.ozon.ru/search/?text=' + q], ['WB', 'https://www.wildberries.ru/catalog/0/search.aspx?search=' + q], ['Маркет', 'https://market.yandex.ru/search?text=' + q]];
};

function prodCard(x, mini) {
  const c = PILLARS[x.pl].c, links = shopLinks(x);
  if (mini) return `<div class="prodmini" style="--c:${c}"><div class="pi" style="color:${c}">${pimg(x.type)}</div><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13.5px;line-height:1.25">${x.b} · ${x.n}</div><div class="hint" style="font-size:12px">≈ ${x.p.toLocaleString('ru')} ₽</div><div>${links.slice(0, 2).map(([l, u]) => `<a class="buy" data-ext href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join('')}</div></div></div>`;
  return `<div class="pcard" style="--c:${c}"><div class="pi" style="color:${c}">${pimg(x.type)}</div><div style="flex:1;min-width:0">
    <div class="n">${x.b !== 'База' && x.b !== 'Спорт' && x.b !== 'Сон' ? `<span style="color:${c}">${x.b}</span> · ` : ''}${x.n}</div>
    <div class="w">${x.w}</div><div class="pr">≈ ${x.p.toLocaleString('ru')} ₽ · ${'₽'.repeat(tierOf(x.p))}</div>
    <div>${links.map(([l, u]) => `<a class="buy" data-ext href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join('')}</div></div></div>`;
}
// Средства, упомянутые в ответе тренера — показываем карточками под сообщением

// Когда будут снятые видео, у упражнения появится поле video, и оно заменит схему.
const SA = (attr, vals, dur) => `<animate attributeName="${attr}" values="${vals}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>`;
const L2 = (x1, y1, x2, y2, d, cls) => {
  // линия, у которой любая координата может быть анимирована: число или [a, b]
  const v = (n, k) => Array.isArray(n) ? `${k}="${n[0]}"` : `${k}="${n}"`;
  const an = (n, k) => Array.isArray(n) ? SA(k, `${n[0]};${n[1]};${n[0]}`, d) : '';
  return `<line ${v(x1, 'x1')} ${v(y1, 'y1')} ${v(x2, 'x2')} ${v(y2, 'y2')}${cls ? ` class="${cls}"` : ''}>${an(x1, 'x1')}${an(y1, 'y1')}${an(x2, 'x2')}${an(y2, 'y2')}</line>`;
};
const C2 = (cx, cy, r, d, extra) => {
  const v = (n, k) => Array.isArray(n) ? `${k}="${n[0]}"` : `${k}="${n}"`;
  const an = (n, k) => Array.isArray(n) ? SA(k, `${n[0]};${n[1]};${n[0]}`, d) : '';
  return `<circle ${v(cx, 'cx')} ${v(cy, 'cy')} r="${r}" ${extra || ''}>${an(cx, 'cx')}${an(cy, 'cy')}</circle>`;
};

    'Основа капсулы — нейтральные цвета: чёрный, белый, серый, тёмно-синий, бежевый. Они сочетаются друг с другом без раздумий. Один-два акцентных цвета (оливковый, бордовый, горчичный) — максимум.',
    { h: 'Сам список' },
    'Верх: 3 плотные однотонные футболки (белая, чёрная, серая), 1 рубашка оксфорд (белая или голубая), 1 лонгслив или поло, 1 худи или свитшот без надписей, 1 тонкий свитер.',
    'Низ: прямые тёмные джинсы, чиносы (бежевые или оливковые), спортивные штаны прямого кроя «на выход».',
    'Верхняя одежда: куртка по сезону (бомбер, ветровка или пуховик без лишних деталей) и что-то поприличнее — пальто или овершот.',
    'Обувь: белые кожаные кеды, ботинки (челси или дерби), кроссовки для спорта.',
    { q: 'Пятнадцать вещей по размеру выглядят дороже, чем пятьдесят случайных.' },
    { h: 'Посадка важнее бренда' },
    'Шов плеча — на краю плеча. Футболка заканчивается на середине ширинки. Брюки не собираются гармошкой на обуви. Вещь, которая почти подходит, можно ушить у портного за 300–700 ₽ — и она начнёт выглядеть как дорогая.',
    { h: 'Как собрать без больших трат' },
    'Начни с ревизии: всё, что не носил год, плохо сидит или с огромными логотипами — в отдельный пакет. Потом закрой дыры из списка выше по одной вещи. Плотность футболки (от 200 г/м²) важнее надписи на бирке.',
    { h: 'Уход за вещами — половина стиля' },
    'Отпаренная рубашка и чистая обувь делают больше, чем новая куртка. Катышки снимаются машинкой за 300 ₽. Белые кеды чистятся зубной щёткой и пастой за 5 минут.',
    'Собери капсулу за месяц — и утром будешь одеваться за две минуты, выглядя при этом собранно каждый день.'
  ] },
  { id: 'x3', wk: 1, tag: 'Осанка', img: 'arms', art: 'a3', t: 'Осанка за 4 недели: почему сутулишься и как это исправить', min: 8, body: [
    'Сутулость — это не приговор и не генетика. В 9 из 10 случаев это привычка: часы за телефоном и компьютером, слабая спина и зажатая грудь. Хорошая новость — привычку можно переучить.',
    { h: 'Что происходит в теле' },
    'Когда ты долго сидишь, наклонившись вперёд, грудные мышцы укорачиваются и тянут плечи вперёд. Мышцы между лопатками растягиваются и слабеют. Голова уходит вперёд — и каждые 2–3 см наклона добавляют шее несколько килограммов нагрузки.',
    'Визуально сутулость съедает рост, делает живот больше, а самого человека — неуверенным. Ровная спина работает наоборот.',
    { h: 'Неделя 1–2: включить нужные мышцы' },
    'Каждый день: 2 минуты у стены (затылок, лопатки и ягодицы касаются стены, подбородок чуть к себе). Растяжка грудных в дверном проёме — 2 × 30 секунд. «Ангелы у стены» — 2 × 10 медленных повторов.',
    { h: 'Неделя 3–4: укрепить' },
    'Добавь тягу резинки к лицу (face pull) 3 × 15, «супермена» на полу 3 × 12 и австралийские подтягивания или тягу резинки к поясу. Это мышцы, которые держат плечи на месте.',
    { q: 'Мышцы держат осанку только тогда, когда они сильнее твоей привычки сутулиться.' },
    { h: 'Привычка важнее упражнений' },
    'Поставь 5 напоминаний в день: в этот момент выпрями спину, опусти плечи вниз и назад, подбородок к себе. Подними монитор до уровня глаз, телефон держи выше, а не на уровне живота.',
    { h: 'Чего не делать' },
    'Не «выпячивай» грудь колесом и не прогибай поясницу — это другая крайность. Не покупай корректоры осанки на весь день: мышцы расслабятся ещё сильнее. Если есть боль в спине, онемение рук — сначала к врачу.',
    'Через 4 недели сравни фото сбоку «до» и «после». Разница обычно заметна даже тем, кто ничего не знал о твоих стараниях.'
  ] },
  { id: 'x4', wk: 1, tag: 'Волосы', img: 'barber', art: 'a5', t: 'Как выбрать стрижку и не стесняться барбера', min: 7, body: [
    'Хорошая стрижка — самый быстрый апгрейд внешности. Она меняет впечатление за один час, и это видно сразу. Проблема в том, что большинство садится в кресло со словами «покороче» — и получает то же, что и всегда.',
    { h: 'Начни с типа волос' },
    'Прямые и тонкие — лучше короче по бокам и с текстурой сверху: длинные тонкие волосы ложатся плоско. Густые и жёсткие — можно оставить длину, они держат форму. Волнистые — не срезай всю длину: волна — твоё преимущество. Если волосы редеют — короткая стрижка смотрится аккуратнее, чем попытка что-то скрыть.',
    { h: 'Принеси фото — это нормально' },
    'Сохрани 3–5 фото стрижек на парнях с похожими волосами. Барберу так проще: «покороче» каждый понимает по-своему, а фото понимают все одинаково. Покажи, что нравится, и честно спроси: «Подойдёт ли это моим волосам?»',
    { h: 'Слова, которые помогут' },
    'Фейд (fade) — плавный переход от очень коротких висков к длине. Андеркат — резкий переход. Текстура — волосы сверху делают «рваными», чтобы легко укладывались. «Оставить длину сверху» — главная фраза, если не хочешь стрижку под ноль.',
    { q: 'Свежая стрижка раз в 3–4 недели даёт больше, чем любая новая вещь в гардеробе.' },
    { h: 'Укладка — это 2 минуты' },
    'Подсуши волосы феном, направляя их как хочешь. Возьми горошину матовой глины или пасты, разотри между ладонями до прозрачности и распредели от корней. Пудра для объёма — если волосы тонкие и падают.',
    'Совет: в конце стрижки попроси барбера показать, как он укладывает. Это бесплатный урок, который сэкономит месяцы экспериментов.'
  ] },
  { id: 'x5', wk: 2, tag: 'Сон', img: 'sleep', art: 'a13', t: 'Сон — бесплатный инструмент внешности', min: 7, body: [
    'Мешки под глазами, тусклая кожа, тяга к сладкому, ноль сил на тренировку — всё это часто не про косметику и не про лень, а про сон. Недосып бьёт по всему сразу.',
    { h: 'Что даёт нормальный сон' },
    'Во сне восстанавливаются мышцы после тренировки и вырабатываются гормоны, нужные для роста и восстановления. Кожа тоже восстанавливается ночью. А после недосыпа повышается аппетит, особенно на сладкое и жирное — это не слабость воли, а гормоны голода.',
    { h: 'Сколько нужно' },
    'Большинству взрослых — 7–9 часов. Ориентир простой: если просыпаешься без будильника в выходные на 2 часа позже обычного — ты недосыпаешь в будни.',
    { h: 'Как начать ложиться раньше' },
    'Не пытайся лечь на 2 часа раньше с завтрашнего дня — не уснёшь. Сдвигай отбой на 15–20 минут каждые несколько дней. Вставай в одно и то же время даже в выходные — это якорь для всего режима.',
    'За 30–60 минут до сна — без телефона в кровати. Дело не только в свете экрана: лента держит мозг в возбуждении. Положи телефон заряжаться в другой конец комнаты, а будильник поставь на часы.',
    { q: 'Хороший день начинается вечером накануне.' },
    { h: 'Спальня' },
    'Темно, прохладно (18–20 °C) и тихо. Маска для сна и беруши стоят копейки и решают половину проблем. Кофе — не позже чем за 8 часов до сна: кофеин держится в крови дольше, чем кажется.',
    'Попробуй неделю ложиться до полуночи — и сравни лицо утром на фото. Это самый дешёвый «уход», который существует.'
  ] },
  { id: 'x6', wk: 2, tag: 'Тело', img: 'gym', art: 'a4', t: 'Тело без зала: первые 8 недель дома', min: 9, body: [
    'Зал не обязателен, чтобы выглядеть лучше. Первые месяцы собственного веса, турника и резинок хватает с запасом — особенно если до этого ты почти не тренировался.',
    { h: 'Три тренировки в неделю' },
    'Понедельник, среда, пятница — или любые три дня с отдыхом между ними. Мышцы растут не на тренировке, а во время восстановления.',
    { h: 'Программа' },
    'Отжимания — 3–4 подхода почти до отказа. Если тяжело — от стола или с колен. Приседания — 3–4 × 15–25, медленно вниз. Подтягивания или австралийские (под столом) — 3–4 подхода. Выпады — 3 × 10 на каждую ногу. Планка — 3 × 30–60 секунд.',
    { h: 'Главное правило: прогрессия' },
    'Каждую неделю делай чуть больше: на 1–2 повтора, на один подход, медленнее опускайся. Если всё время делать одно и то же — тело быстро привыкает, и рост останавливается.',
    { q: 'Не нужно делать много. Нужно делать чуть больше, чем в прошлый раз.' },
    { h: 'Еда решает половину' },
    'Без белка мышцы не растут. Ориентир — белок в каждом приёме пищи: яйца, творог, курица, рыба, бобовые. Сладкую газировку и соки — убрать в первую очередь: это сотни пустых калорий.',
    { h: 'Чего ждать' },
    'Первые 2–3 недели — сила растёт быстрее, чем внешность: нервная система учится работать с мышцами. К 6–8 неделе изменения видно в зеркале и на фото: плечи, руки, осанка.',
    'Делай фото раз в неделю при одном и том же свете. Через два месяца сам удивишься.'
  ] },
  { id: 'x7', wk: 3, tag: 'Уход', img: 'mirror', art: 'a2', t: 'Прыщи: что реально работает, а что — деньги на ветер', min: 9, body: [
    'Прыщи бывают не только у подростков. И главное, что нужно о них знать: это не грязь и не «плохая кожа», а нормальный процесс, на который можно влиять.',
    { h: 'Откуда они берутся' },
    'Кожа производит кожное сало. Если поры забиваются ороговевшими клетками и салом — появляются чёрные точки и закрытые комедоны. Если туда добавляются бактерии и воспаление — красные прыщи.',
    { h: 'Что работает' },
    'Салициловая кислота (BHA) растворяет жир и чистит поры изнутри. Начинай с 2–3 раз в неделю вечером. Ниацинамид снижает жирность и успокаивает воспаления. Бензоилпероксид работает против бактерий — но может сушить и обесцвечивать ткань наволочки.',
    'И самое скучное, но важное: мягкое умывание, лёгкий крем и SPF. Агрессивное очищение делает только хуже.',
    { h: 'Что не работает' },
    'Спирт, зубная паста, лимон, соль, сода на лицо — раздражают кожу и усиливают воспаление. Скрабы с крупными частицами — травмируют. Выдавливание — оставляет пятна, которые держатся месяцами.',
    { q: 'Кислоты дают результат через 4–8 недель. Не через 4 дня.' },
    { h: 'Когда идти к дерматологу' },
    'Если прыщи глубокие и болезненные, оставляют рубцы, если за 2–3 месяца нормального ухода лучше не стало — это к врачу. Есть рецептурные средства, которые работают намного сильнее косметики. Это не стыдно, это быстрее.',
    { h: 'Образ жизни' },
    'Меняй наволочку раз в 3–4 дня, не трогай лицо руками, протирай экран телефона. У некоторых людей высыпания усиливаются от сладкого и молочного — понаблюдай за собой пару недель.',
    'Терпение и регулярность — вот и весь секрет. Через два месяца сравни фото.'
  ] },
  { id: 'x8', wk: 3, tag: 'Общение', img: 'portrait', art: 'a13', t: 'Уверенность без понтов: язык тела', min: 7, body: [
    'Люди составляют впечатление о тебе за первые секунды — и в основном не по словам, а по тому, как ты стоишь, смотришь и двигаешься. Хорошая новость: язык тела можно натренировать как мышцу.',
    { h: 'Занимай своё место' },
    'Неуверенный человек сжимается: плечи вперёд, руки скрещены, взгляд вниз. Уверенный — стоит ровно, плечи расправлены, руки свободно. Не нужно растопыриваться — просто не прячься.',
    { h: 'Взгляд' },
    'Смотри в глаза, когда говоришь и когда слушаешь. Не сверли — нормально отводить взгляд, задумываясь. Ориентир: смотришь в глаза примерно половину разговора.',
    { h: 'Медленнее' },
    'Суетливые движения и быстрая речь читаются как нервозность. Говори чуть медленнее, делай паузы, не бойся тишины. Паузы делают слова весомее.',
    { q: 'Уверенность — это не отсутствие страха. Это когда страх не управляет твоим телом.' },
    { h: 'Рукопожатие и улыбка' },
    'Рука — крепко, но не до хруста, 2–3 секунды, взгляд в глаза. Искренняя улыбка при знакомстве — самый дешёвый способ понравиться. Она работает почти на всех.',
    { h: 'Тренировка' },
    'Каждый день — одна маленькая социальная задача: поздороваться первым, задать вопрос продавцу, сделать комплимент. Именно поэтому в mogg есть миссии общения. Каждая маленькая победа делает следующую проще.'
  ] },
  { id: 'x9', wk: 4, tag: 'Уход', img: 'beard', art: 'a8', t: 'Борода и щетина: отращивать или брить', min: 6, body: [
    'Борода может сделать лицо мужественнее и скрыть то, что тебе не нравится. А может выглядеть неопрятно и добавить лет. Всё решает уход.',
    { h: 'Сначала проверь, как растёт' },
    'Дай бороде 3–4 недели и не трогай её. Первые две недели — самые неудобные: чешется и выглядит неряшливо. Это нормально. Через месяц станет понятно, густая она или растёт клочками.',
    { h: 'Если растёт клочками' },
    'Лучше короткая щетина 3–5 мм, подстриженная триммером раз в 3–4 дня, или чистое бритьё. Редкая длинная борода выглядит хуже, чем аккуратная щетина.',
    { h: 'Контуры решают всё' },
    'Линия на шее — примерно на два пальца выше кадыка. Всё, что ниже, — сбривать. Линия на щеках — естественная или чуть подровненная. Чёткие контуры сразу делают бороду «дорогой».',
    { q: 'Неухоженная борода говорит «мне всё равно». Ухоженная — «я знаю, что делаю».' },
    { h: 'Уход' },
    'Мой бороду так же, как волосы. Масло для бороды — 2–3 капли после душа: убирает зуд и колючесть. Расчёсывай — так она ложится ровнее.',
    { h: 'Если бреешься' },
    'Брейся после душа, по росту волос, острым лезвием. Если появляется раздражение и вросшие волосы — попробуй триммер-бритву: она оставляет немного длины и почти не раздражает кожу.'
  ] },
  { id: 'x10', wk: 4, tag: 'Стиль', img: 'jacket', art: 'a10', t: 'Запах: то, что замечают все, но никто не скажет', min: 6, body: [
    'Тебе никогда не скажут, что от тебя пахнет. Просто будут держаться подальше. Поэтому гигиена — это база, которую нужно закрыть раз и навсегда.',
    { h: 'Дезодорант и антиперспирант — не одно и то же' },
    'Дезодорант маскирует запах. Антиперспирант уменьшает количество пота. Если потеешь — нужен антиперспирант. Секрет, о котором мало кто знает: наносить его лучше вечером на сухую кожу. За ночь он успевает сработать, и утренний душ его не смоет.',
    { h: 'Одежда' },
    'Синтетика удерживает запах сильнее хлопка. Футболки после спорта стирай сразу, не оставляй в корзине на неделю. Обувь — давай ей сохнуть сутки между носками, используй стельки, которые можно стирать.',
    { h: 'Парфюм' },
    'Меньше — лучше. 1–2 нажатия: на шею или запястья. Не растирай. Если запах чувствуешь ты сам через час — значит, окружающие чувствуют его слишком сильно.',
    { q: 'Лучший запах — чистое тело и свежая одежда. Парфюм — только сверху.' },
    { h: 'Если потеешь сильно' },
    'Попробуй аптечное средство от сильной потливости — его наносят раз в несколько дней. Если и оно не помогает — сходи к врачу: есть методы, которые решают проблему.',
    'Свежее дыхание — туда же: щётка 2 раза в день, зубная нить, чистка языка. Мелочи, которые делают огромную разницу при общении.'
  ] },
  { id: 'x11', wk: 5, tag: 'Тело', img: 'run', art: 'a4', t: 'Еда без диет: что поменять, чтобы выглядеть лучше', min: 8, body: [
    'Тебе не нужен подсчёт калорий и меню по граммам, чтобы выглядеть лучше. Хватит нескольких правил, которые закрывают 80% результата.',
    { h: 'Белок в каждом приёме пищи' },
    'Белок нужен мышцам, коже, волосам и даёт сытость. Яйца, творог, курица, индейка, рыба, говядина, бобовые. Простое правило: на каждой тарелке — ладонь белка.',
    { h: 'Убрать жидкие калории' },
    'Сладкая газировка, соки, энергетики, сладкий кофе — это сотни калорий, которые не насыщают. Просто заменив их на воду, чай или кофе без сахара, многие худеют без всяких диет.',
    { h: 'Овощи и вода' },
    'Овощи — половина тарелки, когда получается. Вода — 1,5–2,5 литра в день, больше в жару и после спорта. Обезвоживание видно по коже и по энергии.',

  { id: 'x12', wk: 5, tag: 'Уход', img: 'serum', art: 'a6', t: 'Отёки и круги под глазами: что можно исправить', min: 6, body: [

// Статьи о парфюме: открыты сразу, показываются и в ленте, и в разделе «Парфюм»
const ARTICLES_PERFUME = [
  { id: 'pf1', wk: 0, tag: 'Парфюм', em: '⚗️', art: 'a2', t: 'Как появился парфюм: от дыма в храме до флакона на полке', body: [
    'Парфюму больше четырёх тысяч лет, и почти всё это время он не был жидкостью во флаконе. Само слово происходит от латинского per fumum — «через дым». Первые ароматы — это смолы и травы, которые сжигали в храмах: считалось, что дым поднимает молитвы к богам.',
    { h: 'Вавилон и Египет' },
    'Имя первого парфюмера нам известно. Клинописная табличка из Вавилона, которой больше трёх тысяч лет, рассказывает о женщине по имени Таппути: она работала при царском дворце и получала ароматы из цветов, масел и смол. Её часто называют первым химиком в истории.',
    'Египтяне превратили ароматы в повседневность. Они готовили кифи — смесь из мёда, вина, изюма и смол — и использовали душистые масла и для ритуалов, и просто чтобы хорошо пахнуть в жарком климате.',
    { h: 'Арабы и перегонка' },

    { q: 'Спиртовые духи появились в Европе только в XIV веке — их называли «вода венгерской королевы».' },
    { h: 'Грас: город перчаточников' },
    'Столицей парфюмерии стал маленький французский город Грас, и причина неожиданная. Там выделывали кожу для перчаток, а выделка сильно пахла. Перчатки начали пропитывать ароматами, мода понравилась двору — и постепенно в Грасе стали выращивать жасмин, розу и лаванду уже ради самих духов.',
    { h: 'Одеколон' },
    'В 1709 году итальянец Иоганн Мария Фарина создал в Кёльне лёгкую цитрусовую воду и назвал её в честь города — Eau de Cologne. Она была настолько свежей по сравнению с тяжёлыми ароматами того времени, что стала сенсацией. Слово «одеколон» — именно отсюда.',
    { h: 'Рождение современной парфюмерии' },
    'До конца XIX века духи делали только из натурального сырья. В 1882 году в аромате Fougère Royale впервые использовали синтетическую молекулу — кумарин с запахом свежего сена. Это изменило всё: химия позволила создавать запахи, которых нет в природе, и сделала духи доступнее.',
    'В 1921 году вышел Chanel № 5 с яркой дозой альдегидов — молекул, дающих «шипучий» эффект. А в 1966 году открыли калон, молекулу с запахом моря: на ней выросла целая волна свежих ароматов 90-х, включая Acqua di Giò.',
    { h: 'Что сейчас' },
    'Сегодня рынок делится на три части. Масс-маркет — недорого и просто. Дизайнерские ароматы модных домов — то, что стоит в любом парфюмерном магазине. И ниша — небольшие бренды, которые делают смелые и дорогие ароматы. Плюс огромный мир бюджетных арабских парфюмов, которые повторяют хиты за малую часть цены.',
    'Забавно, что за четыре тысячи лет суть не изменилась: человек хочет пахнуть хорошо и быть запоминающимся. Изменились только технологии.'

  { id: 'pf2', wk: 0, tag: 'Парфюм', em: '🧠', art: 'a12', t: 'Почему запах важнее, чем кажется', body: [
    'Мы привыкли думать, что впечатление о человеке складывается из того, что видно и слышно. Но запах работает раньше и глубже — и почти всегда незаметно для сознания.',
    { h: 'Короткая дорога в память' },
    'Сигналы от носа попадают в области мозга, отвечающие за эмоции и память, почти напрямую. Поэтому запах способен мгновенно вернуть в прошлое: бабушкина кухня, раздевалка в спортзале, первое свидание. Этот эффект называют феноменом Пруста — по имени писателя, который описал, как вкус и запах печенья вытащили из памяти целое детство.',
    { q: 'Лицо человека можно забыть. Его запах — гораздо труднее.' },
    { h: 'Запах — часть первого впечатления' },
    'Приятный запах люди считывают как признак аккуратности: человек следит за собой. Неприятный перечёркивает и стрижку, и одежду. При этом никто не скажет тебе об этом вслух — просто будут держаться чуть дальше.',
    'Важно понимать порядок. Парфюм не заменяет гигиену, а дополняет её. Душ, чистая одежда, дезодорант — это основа. Аромат поверх несвежего тела делает только хуже.',
    { h: 'Почему ты не слышишь свой парфюм' },

    'Правило простое: если ты перестал слышать свой парфюм, это не значит, что он выветрился. Окружающие слышат его прекрасно.',
    { h: 'Аромат как подпись' },
    'Когда человек долго носит один аромат, тот начинает с ним ассоциироваться. Это и есть «подпись»: запах, по которому тебя узнают и вспоминают. Не обязательно иметь десять флаконов — хватит одного-двух, которые тебе действительно идут.',
    { h: 'Что это даёт тебе самому' },
    'Аромат влияет и на того, кто его носит. Многие замечают, что с любимым парфюмом чувствуют себя собраннее и увереннее — примерно как в хорошо сидящей одежде. Это не магия, а привычный ритуал: ты подготовился и готов к дню.'
  ] },
  { id: 'pf3', wk: 0, tag: 'Парфюм', em: '🧪', art: 'a1', t: 'Как устроен аромат: ноты, пирамида и что значит EDT', body: [
    'На коробке написано «EDP», в описании — «верхние ноты бергамота, сердце из лаванды, база из амбры». Разберём, что всё это значит, чтобы ты читал описания ароматов как меню, а не как шифр.',
    { h: 'Пирамида: три этапа одного аромата' },
    'Аромат меняется со временем, потому что разные молекулы испаряются с разной скоростью. Это описывают как пирамиду из трёх уровней.',
    'Верхние ноты слышны сразу и держатся около 15 минут. Обычно это цитрусы, зелень, лёгкие фрукты. Именно их ты чувствуешь в магазине — и именно по ним делать выводы рано.',
    'Ноты сердца раскрываются следом и живут пару часов: цветы, специи, травы. Это характер аромата.',
    'Базовые ноты остаются до конца дня: дерево, амбра, мускус, ваниль. Это то, чем от тебя будет пахнуть вечером и что останется на шарфе.',
    { q: 'Никогда не покупай аромат по первым минутам. Дождись базы — с ней тебе жить.' },
    { h: 'Что значат буквы на флаконе' },
    'Буквы показывают концентрацию душистых веществ. Одеколон (EDC) — примерно 2–5%, туалетная вода (EDT) — около 5–15%, парфюмерная вода (EDP) — около 15–20%, духи (Parfum, Extrait) — от 20% и выше. Точных стандартов нет, у каждого бренда свои цифры.',
    'Чем выше концентрация, тем аромат обычно плотнее и дольше держится. Но это не значит «лучше»: EDT часто свежее и уместнее днём, а EDP и духи — на вечер и холод.',
    { h: 'Стойкость и шлейф — разные вещи' },
    'Стойкость — сколько часов аромат остаётся на коже. Шлейф — насколько далеко его слышно. Бывают ароматы, которые держатся сутки, но слышны только вплотную, и наоборот: громкие первые два часа, а потом исчезают.',
    { h: 'Основные семейства' },
    'Свежие — цитрусы, море, зелень: лето, спорт, учёба. Древесные — кедр, сандал, ветивер: универсально и по-взрослому. Восточные, или амбровые, — ваниль, смолы, специи: тепло, вечер, зима. Фужерные — лаванда, мох, кумарин: классический «мужской» запах барбершопа.',
    { h: 'Почему на друге пахнет иначе' },
    'Один и тот же аромат звучит по-разному на разных людях. Влияют тип кожи, её увлажнённость, температура тела и даже питание. На сухой коже аромат улетает быстрее, на жирной держится дольше и звучит плотнее. Поэтому чужой совет «бери, он классный» ничего не гарантирует — пробовать нужно на себе.'

  { id: 'pf4', wk: 0, tag: 'Парфюм', em: '💨', art: 'a4', t: 'Как наносить парфюм: сколько пшиков и куда', body: [
    'Можно купить отличный аромат и испортить впечатление тем, как ты его носишь. Правил немного, и они простые.',

  { id: 'pf5', wk: 0, tag: 'Парфюм', em: '🛍', art: 'a5', t: 'Как выбрать парфюм и не выбросить деньги', body: [
    'Самая частая история: понравился запах на бумажке в магазине, купил флакон, через неделю понял, что носить его не можешь. Вот как этого избежать.',

    'Тебе не нужно десять флаконов. Рабочая схема — два-три. Свежий на каждый день и тёплую погоду. Плотный на холод и вечер. И, если хочется, один особенный — на важные случаи.',

    'Дизайнерские ароматы — безопасный выбор: их делают так, чтобы нравиться большинству. Ниша интереснее, но дороже и рискованнее. Бюджетные арабские бренды выпускают ароматы «в духе» известных хитов: они не идентичны оригиналу, но часто дают похожее впечатление за малую часть цены. Для старта это разумный вариант.',

  ] }

    { h: 'Частые вопросы' },

function analyze() {

  const has = (x) => ob.issues.includes(x);

    style: ['Сначала посадка, потом бренды. Однотонная база по размеру смотрится дороже.', 'Чистая обувь и отпаренная одежда — бесплатный апгрейд образа.'],
    sleep: ['Недосып — это мешки под глазами, тусклая кожа и тяга к сладкому. Цель — 7–8 часов.']

  // Под каждую задачу берём конкретное средство из каталога, которое влезает в бюджет

function toggleStep(key) {
  const d = today(), id = key.split(':')[0], a = S.protos.active.find((x) => x.id === id);
  if (!a) return;
  S.pdone = S.pdone || {}; S.pfull = S.pfull || {};
  const arr = S.pdone[d] = S.pdone[d] || [], fk = d + ':' + id, before = xp();
  withRankCheck(() => {
    const i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else { arr.push(key); justDone = key; }
    const t = protoToday(a);
    if (t.req && t.reqDone === t.req) S.pfull[fk] = 1; else delete S.pfull[fk];
  });
  const got = xp() - before;
  if (got > 0) { floatXP(`+${got} XP`); haptic(S.pfull[fk] ? 'success' : 'medium'); if (got > 5) { confetti(); toast('День протокола закрыт'); } } else haptic('light');
  save(); render();
}
function activateNext() {
  const P = S.protos;
  while (P.active.length < MAX_ACTIVE && P.queue.length) {
    const id = P.queue.shift();
    P.active.push({ id, start: today() });
    addEvent('proto', 'Начали протокол: ' + PROTOCOLS[id].t);
  }
}

    }).join('');

  </div>`;
}
// Режем текст на карточки: заголовок начинает новую, слишком длинный раздел делится на части
function storySlides(it) {
  const slides = []; let cur = { h: '', parts: [], len: 0 };
  const push = () => { if (cur.parts.length) slides.push(cur); };
  it.body.forEach((b) => {
    if (typeof b !== 'string' && b.h) { push(); cur = { h: b.h, parts: [], len: 0 }; return; }
    const len = String(typeof b === 'string' ? b : b.q).length;
    if (cur.len && cur.len + len > 640) { push(); cur = { h: cur.h, cont: true, parts: [], len: 0 }; }
    cur.parts.push(b); cur.len += len;
  });
  push();
  return slides;
}
function stGo(d) {
  const tr = document.getElementById('stTrack'); if (!tr) return;
  const i = Math.round(tr.scrollLeft / tr.clientWidth) + d;
  haptic('light');
  tr.scrollTo({ left: i * tr.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
}
// Какая карточка сейчас на экране: полоска сверху, счётчик, стрелки
function stSync() {
  const tr = document.getElementById('stTrack'); if (!tr || !reader) return;
  const slides = tr.children, last = slides.length - 1;
  const i = Math.max(0, Math.min(last, Math.round(tr.scrollLeft / tr.clientWidth)));
  reader.i = i;
  if (i === last) reader.bottom = true;
  for (let k = 0; k <= last; k++) slides[k].classList.toggle('on', k === i);
  const bar = document.getElementById('stBar');
  if (bar) [...bar.children].forEach((b, k) => b.classList.toggle('on', k <= i));
  const cnt = document.getElementById('stCnt'); if (cnt) cnt.textContent = `${i + 1} / ${last + 1}`;
  const pv = document.getElementById('stPrev'), nx = document.getElementById('stNext');
  if (pv) pv.disabled = i === 0;
  if (nx) nx.disabled = i === last;
}

// «Прочитал» открывается, когда карточки долистаны до последней и прошло хотя бы ~6 секунд на минуту чтения
let readerTimer = null;
function readerReady() {
  if (!reader || reader.kind === 'book') return true;
  const it = (reader.kind === 'lesson' ? ALL_LESSONS : ARTICLES).find((x) => x.id === reader.id);
  if (!it) return false;
  return !!reader.bottom && Date.now() - reader.t0 >= it.min * 6000;
}
function armReader() {
  clearInterval(readerTimer);
  const tr = document.getElementById('stTrack');
  if (!tr) return;
  // после перерисовки возвращаемся на ту же карточку
  if (reader.i) tr.scrollLeft = reader.i * tr.clientWidth;
  let tick = false;
  tr.addEventListener('scroll', () => { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; stSync(); upd(); }); }, { passive: true });
  const btn = document.getElementById('markBtn');
  const ids = reader.kind === 'lesson' ? S.lessons : S.articles;
  const paid = readsToday(ids) < (reader.kind === 'lesson' ? CAP.lesson : CAP.article);
  const upd = () => {
    if (!btn || !readerReady()) return;
    btn.disabled = false;
    btn.textContent = paid ? `Прочитал · +${reader.kind === 'lesson' ? 25 : 5} XP` : 'Прочитал · XP на сегодня уже получен';
    clearInterval(readerTimer);
  };
  stSync();
  if (btn) readerTimer = setInterval(upd, 1000);
  upd();
}

function readPhoto(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, (max || 600) / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

// Чистим маску: убираем мелкие ошмётки фона, делаем край чётче, обрезаем пустые поля, определяем цвет
function wFinish(src, raw) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height, c = document.createElement('canvas');

      const id = x.getImageData(0, 0, w, h), d = id.data, n = w * h;
      if (!raw) {

        const lab = new Int32Array(n), st = new Int32Array(n), sizes = [0];
        let L = 0;
        for (let p = 0; p < n; p++) {
          if (lab[p] || d[p * 4 + 3] < 128) continue;
          L++; let top = 0, cnt = 0; st[top++] = p; lab[p] = L;
          while (top) {
            const q = st[--top], qx = q % w; cnt++;
            if (qx > 0 && !lab[q - 1] && d[(q - 1) * 4 + 3] >= 128) { lab[q - 1] = L; st[top++] = q - 1; }
            if (qx < w - 1 && !lab[q + 1] && d[(q + 1) * 4 + 3] >= 128) { lab[q + 1] = L; st[top++] = q + 1; }
            if (q >= w && !lab[q - w] && d[(q - w) * 4 + 3] >= 128) { lab[q - w] = L; st[top++] = q - w; }
            if (q < n - w && !lab[q + w] && d[(q + w) * 4 + 3] >= 128) { lab[q + w] = L; st[top++] = q + w; }
          }
          sizes.push(cnt);
        }
        let big = 0; for (const s of sizes) if (s > big) big = s;
        const keep = sizes.map((s) => s >= big * 0.12);
        for (let p = 0; p < n; p++) {
          let a = d[p * 4 + 3];
          if (a >= 128 && !keep[lab[p]]) a = 0;
          // мягкий край оставляем, полупрозрачную дымку убираем
          a = a < 50 ? 0 : a > 205 ? 255 : Math.round(((a - 50) / 155) * 255);
          d[p * 4 + 3] = a;
        }
        x.putImageData(id, 0, 0);

      const hist = {};
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
        const p = (y * w + i) * 4;
        if (d[p + 3] < 60) continue;
        if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if ((i + y) % 5) continue;
        const k = (d[p] >> 4) + ',' + (d[p + 1] >> 4) + ',' + (d[p + 2] >> 4);
        hist[k] = (hist[k] || 0) + 1;
      }
      if (x1 < 0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
      const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.03), cw = x1 - x0 + 1 + pad * 2, ch = y1 - y0 + 1 + pad * 2;
      const k = Math.min(1, 800 / Math.max(cw, ch)), o = document.createElement('canvas');
      o.width = Math.round(cw * k); o.height = Math.round(ch * k);
      const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high';
      ox.drawImage(c, x0 - pad, y0 - pad, cw, ch, 0, 0, o.width, o.height);
      let url = o.toDataURL('image/webp', 0.88);
      if (!url.startsWith('data:image/webp')) url = o.toDataURL('image/png');
      const top = Object.entries(hist).sort((a, b) => b[1] - a[1])[0];
      let color = '';
      if (top) {

        color = W_COLORS.map(([nm, c2]) => [nm, (c2[0] - rgb[0]) ** 2 + (c2[1] - rgb[1]) ** 2 + (c2[2] - rgb[2]) ** 2]).sort((a, b) => a[1] - b[1])[0][0];
      }
      res({ url, color });
    };

  });
}

// Долгое нажатие на вещь внизу — удалить из гардероба
(() => {

  });

// Жесты на холсте: один палец — двигать, уголок — размер и поворот, два пальца — то же щипком
(() => {
  const ptr = new Map();
  let g = null;
  const lim = (v, a, b) => Math.max(a, Math.min(b, v));
  const snap = () => {
    const p = wlay.find((q) => q.id === g.id), flat = document.querySelector('.flat.edit');
    if (!p || !flat) { g = null; return; }
    g.rect = flat.getBoundingClientRect(); g.start = { ...p }; g.pts = new Map([...ptr].map(([k, v]) => [k, { ...v }]));
  };
  const apply = (p) => { const el = document.querySelector(`.flat.edit .fl[data-id="${p.id}"]`); if (el) el.style.cssText = `${wPos(p)};z-index:${wlay.indexOf(p) + 1}`; };
  document.addEventListener('pointerdown', (e) => {
    const flat = e.target.closest && e.target.closest('.flat.edit');
    if (!flat) return;
    const fl = e.target.closest('.fl');
    if (!fl) { if (!ptr.size && wsel) { wsel = null; render(); } return; }
    e.preventDefault();
    const id = fl.dataset.id;
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!g || g.id !== id) {
      g = { id, handle: !!e.target.closest('.flh') };
      if (wsel !== id) { wsel = id; haptic('light'); render(); }
    }
    snap();
  }, { passive: false });
  document.addEventListener('pointermove', (e) => {
    if (!g || !ptr.has(e.pointerId)) return;
    e.preventDefault();
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = wlay.find((q) => q.id === g.id);
    if (!p) return;
    const R = g.rect, s0 = g.start, ids = [...g.pts.keys()].filter((k) => ptr.has(k));
    const cx = R.left + (s0.x / 100) * R.width, cy = R.top + (s0.y / 100) * R.height;
    let k = 1, rot = 0, dx = 0, dy = 0;
    if (ids.length >= 2) {
      const [a0, b0] = [g.pts.get(ids[0]), g.pts.get(ids[1])], [a1, b1] = [ptr.get(ids[0]), ptr.get(ids[1])];
      k = Math.hypot(b1.x - a1.x, b1.y - a1.y) / (Math.hypot(b0.x - a0.x, b0.y - a0.y) || 1);
      rot = (Math.atan2(b1.y - a1.y, b1.x - a1.x) - Math.atan2(b0.y - a0.y, b0.x - a0.x)) * 180 / Math.PI;
      dx = ((a1.x + b1.x) - (a0.x + b0.x)) / 2; dy = ((a1.y + b1.y) - (a0.y + b0.y)) / 2;
    } else if (ids.length === 1) {
      const a0 = g.pts.get(ids[0]), a1 = ptr.get(ids[0]);
      if (g.handle) {
        k = Math.hypot(a1.x - cx, a1.y - cy) / (Math.hypot(a0.x - cx, a0.y - cy) || 1);
        rot = (Math.atan2(a1.y - cy, a1.x - cx) - Math.atan2(a0.y - cy, a0.x - cx)) * 180 / Math.PI;
      } else { dx = a1.x - a0.x; dy = a1.y - a0.y; }
    }
    k = lim(k, 12 / s0.w, 140 / s0.w);
    p.w = s0.w * k; p.h = s0.h * k; p.r = Math.round(((s0.r || 0) + rot) * 10) / 10;
    if (Math.abs(p.r % 90) < 3 || Math.abs(p.r % 90) > 87) p.r = Math.round(p.r / 90) * 90; // прилипает к ровному
    p.x = lim(s0.x + (dx / R.width) * 100, 4, 96); p.y = lim(s0.y + (dy / R.height) * 100, 4, 96);
    apply(p);
  }, { passive: false });
  const up = (e) => {
    if (!ptr.has(e.pointerId)) return;
    ptr.delete(e.pointerId);
    if (!ptr.size) { g = null; return; }
    if (g) { g.handle = false; snap(); }
  };
  addEventListener('pointerup', up, true);
  addEventListener('pointercancel', up, true);
})();

// ---------- друзья: у каждого свой ID, заявка по ID, входящие, список друзей ----------
// Всё хранит сервер (та же функция Yandex Cloud, что и ИИ). Нужные ей действия:
//   friends                  → { me: { code, name }, friends: [{ code, name }], incoming: [{ code, name }], outgoing: [{ code, name }] }
//   friend_add { code }      → то же состояние | { error: 'not_found' | 'self' | 'already' | 'pending' }
//   friend_answer { code, accept } → состояние
//   friend_remove { code }   → состояние (у обоих; для исходящей заявки — отменяет её)
// ID — 6 символов без похожих букв (без 0/O, 1/I/L), выдаётся сервером один раз и навсегда.
let FR = null, frBusy = false, frIn = '', frDemo = false;
const frClean = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
// Вне Telegram сервер не пускает — показываем пример, чтобы было видно, как это работает
const FR_DEMO = () => ({ me: { code: 'K7P2QX', name: (tgUser && tgUser.first_name) || 'Ты' }, friends: [{ code: 'Z4X9MN', name: 'Даня' }], incoming: [{ code: 'B4N8TR', name: 'Артём' }], outgoing: [] });
function frDemoCall(action, p) {
  const s = FR || FR_DEMO(), f = (l) => l.find((x) => x.code === p.code);
  if (action === 'friend_add') {
    if (p.code === s.me.code) return { error: 'self' };
    if (f(s.friends)) return { error: 'already' };
    if (f(s.outgoing)) return { error: 'pending' };
    const inc = f(s.incoming);
    if (inc) { s.incoming = s.incoming.filter((x) => x !== inc); s.friends.unshift(inc); return s; }
    if (p.code.length !== 6) return { error: 'not_found' };
    s.outgoing.unshift({ code: p.code, name: 'Игрок ' + p.code.slice(0, 2) });
  }
  if (action === 'friend_answer') { const x = f(s.incoming); s.incoming = s.incoming.filter((y) => y !== x); if (x && p.accept) s.friends.unshift(x); }
  if (action === 'friend_remove') { s.friends = s.friends.filter((x) => x.code !== p.code); s.outgoing = s.outgoing.filter((x) => x.code !== p.code); }
  return JSON.parse(JSON.stringify(s));
}
async function frCall(action, p) {
  if (frDemo) return frDemoCall(action, p || {});
  const r = AI_ENDPOINT ? await aiCall(action, p || {}, 15000) : { error: 'off' };
  if (r.error === 'not_telegram' || r.error === 'off') { frDemo = true; if (!FR) FR = FR_DEMO(); return frDemoCall(action, p || {}); }
  return r;
}
async function frLoad(silent) {
  if (frBusy) return;
  frBusy = true;
  const r = await frCall('friends');
  frBusy = false;
  if (r && r.me) { FR = r; S.frCode = r.me.code; save(); }
  else if (!silent) toast(`Не получилось загрузить друзей (${(r && r.error) || 'нет ответа'})`);
  if (tab === 'friends' || tab === 'me') render();
}
const frAva = (p, cls) => `<span class="fava ${cls || ''}" style="--h:${[...p.code].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360}">${esc((p.name || '?').slice(0, 1).toUpperCase())}</span>`;

// Карточка во вкладке «Я»
function friendsCard() {
  const n = FR ? FR.friends.length : 0, inc = FR ? FR.incoming.length : 0, code = (FR && FR.me.code) || S.frCode;
  return `<button class="card fcard" data-act="go" data-tab="friends">
    <div class="row between"><span class="disp" style="font-size:22px">Друзья</span>${inc ? `<span class="fbadge">${inc} ${plural(inc, 'заявка', 'заявки', 'заявок')}</span>` : `<span class="mono">${n || ''}</span>`}</div>
    <div class="row" style="margin-top:10px;gap:10px">
      <div class="favs">${FR && FR.friends.length ? FR.friends.slice(0, 4).map((p) => frAva(p)).join('') : '<span class="fava empty">+</span>'}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700">${n ? `${n} ${plural(n, 'друг', 'друга', 'друзей')}` : 'Добавь друзей по ID'}</div><div class="hint" style="font-size:12.5px">${code ? `Твой ID: <b class="fcode">${code}</b>` : 'Твой ID появится здесь'}</div></div>
      <span class="arrow">${IC.arrow}</span>
    </div></button>`;
}

// Экран друзей
function renderFriends() {
  if (!FR && !frBusy) frLoad();
  const me = FR && FR.me, ok = /^[A-Z0-9]{6}$/.test(frIn);
  const row = (p, btns) => `<div class="frow">${frAva(p)}<div class="fnm"><b>${esc(p.name || 'Без имени')}</b><span class="mono">ID ${p.code}</span></div>${btns}</div>`;
  return `<div class="wbar"><button class="wback" data-act="go" data-tab="me" aria-label="Назад">←</button><b>Друзья</b></div>
    <div class="card fme">
      <span class="mono">[ твой ID ]</span>
      <div class="row between" style="margin-top:6px"><div class="fbig">${me ? me.code : '······'}</div><button class="btn sm" data-act="fr-copy" ${me ? '' : 'disabled'}>Скопировать</button></div>
      <div class="hint" style="font-size:12.5px;margin-top:6px">Отправь его другу — он введёт ID у себя и кинет тебе заявку.</div>
    </div>
    <div class="card">
      <span class="mono">[ добавить друга ]</span>
      <form class="fadd" data-submit="fr-add"><input id="frIn" class="field" data-input="fr-in" value="${esc(frIn)}" placeholder="ID друга, например B4N8TR" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn sm" id="frSend" ${ok ? '' : 'disabled'}>Кинуть заявку</button></form>
    </div>
    ${!FR ? `<div class="card"><div class="spin" style="margin:10px auto"></div><div class="hint" style="text-align:center">Загружаю…</div></div>` : `
    ${FR.incoming.length ? `<div class="sec"><span class="disp">Заявки</span><span class="chipline">[ ${FR.incoming.length} ]</span></div><div class="card">${FR.incoming.map((p) => row(p, `<div class="fbtns"><button class="btn sm" data-act="fr-yes" data-c="${p.code}">Принять</button><button class="btn sm ghost" data-act="fr-no" data-c="${p.code}" aria-label="Отклонить">✕</button></div>`)).join('')}</div>` : ''}
    <div class="sec"><span class="disp">Мои друзья</span><span class="chipline">[ ${FR.friends.length} ]</span></div>
    <div class="card">${FR.friends.length ? FR.friends.map((p) => row(p, `<button class="fx" data-act="fr-del" data-c="${p.code}" data-n="${esc(p.name || '')}" aria-label="Удалить из друзей">⋯</button>`)).join('') : '<div class="hint">Пока никого. Введи ID друга выше или отправь ему свой.</div>'}</div>
    ${FR.outgoing.length ? `<div class="sec"><span class="disp">Ждут ответа</span><span class="chipline">[ ${FR.outgoing.length} ]</span></div><div class="card">${FR.outgoing.map((p) => row(p, `<button class="btn sm ghost" data-act="fr-cancel" data-c="${p.code}">Отменить</button>`)).join('')}</div>` : ''}
    ${frDemo ? '<div class="hint" style="text-align:center;font-size:12px;margin-top:4px">Это пример. В Telegram будут настоящие ID и заявки.</div>' : ''}`}`;
}
const FR_ERR = { not_found: 'Нет пользователя с таким ID — проверь буквы и цифры', self: 'Это твой собственный ID 🙂', already: 'Вы уже друзья', pending: 'Заявка уже отправлена — ждём ответа' };
async function frApply(action, p, okMsg) {
  const r = await frCall(action, p);
  if (r && r.me) { FR = r; haptic('success'); if (okMsg) toast(okMsg); }
  else toast(FR_ERR[r && r.error] || `Не получилось (${(r && r.error) || 'нет ответа'}) — попробуй ещё раз`);
  render();
  return r;
}
Object.assign(ACT, {
  async 'fr-copy'() {
    const c = FR && FR.me.code;
    if (!c) return;
    try { await navigator.clipboard.writeText(c); toast('ID скопирован'); haptic('light'); }
    catch (e) { toast('Твой ID: ' + c); }
  },
  async 'fr-yes'(el) { await frApply('friend_answer', { code: el.dataset.c, accept: true }, 'Теперь вы друзья 🤝'); },
  async 'fr-no'(el) { await frApply('friend_answer', { code: el.dataset.c, accept: false }); },
  async 'fr-cancel'(el) { await frApply('friend_remove', { code: el.dataset.c }, 'Заявка отменена'); },
  'fr-del'(el) { modal = { kind: 'fr-del', code: el.dataset.c, name: el.dataset.n }; haptic('light'); render(); },
  async 'fr-del-yes'() { const c = modal && modal.code; modal = null; await frApply('friend_remove', { code: c }, 'Удалил из друзей'); }
});
async function frAdd() {
  const code = frClean(frIn);
  if (code.length !== 6) return toast('ID — это 6 букв и цифр');
  const b = document.getElementById('frSend'); if (b) { b.disabled = true; b.textContent = 'Отправляю…'; }
  const before = FR ? FR.friends.length : 0;
  const r = await frApply('friend_add', { code });
  if (r && r.me) { frIn = ''; toast(r.friends.length > before ? 'Он уже звал тебя — теперь вы друзья 🤝' : 'Заявка отправлена'); render(); }
}
document.addEventListener('submit', (e) => { if (e.target.dataset.submit === 'fr-add') { e.preventDefault(); frAdd(); } });
document.addEventListener('input', (e) => {
  if (e.target.dataset.input !== 'fr-in') return;
  const v = frClean(e.target.value);
  if (e.target.value !== v) e.target.value = v;
  frIn = v;
  const b = document.getElementById('frSend'); if (b) b.disabled = !/^[A-Z0-9]{6}$/.test(v);
});
function frModal() {
  if (modal.kind !== 'fr-del') return '';
  return `<div class="modal"><div class="sheet"><div style="font-weight:800;font-size:18px">Удалить ${esc(modal.name || 'друга')} из друзей?</div>
    <div class="hint" style="margin-top:6px">Он пропадёт из списка у вас обоих. Добавиться снова можно по ID.</div>
    <button class="btn" data-act="fr-del-yes" style="margin-top:16px;--bc:#ff5a1c;--bc2:#ff2d87;--bt:#fff">Удалить</button>
    <button class="btn ghost" data-act="modal-close" style="margin-top:6px;background:none;border:0;height:44px;color:var(--hint)">Отмена</button></div></div>`;
}
// Подтягиваем друзей в фоне при запуске, чтобы на «Я» сразу были ID и заявки
setTimeout(() => { if (S.onboarded) frLoad(true); }, 1500);

start();
</script>
</body>
</html>
