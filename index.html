function journey() {
  const days = {};
  const get = (d) => days[d] = days[d] || { date: d, ev: [], tasks: [] };
  (S.events || []).forEach((e) => get(e.date).ev.push(e));
  Object.entries(S.done || {}).forEach(([d, ids]) => { if (ids.length) get(d).tasks = ids; });
  Object.entries(S.pdone || {}).forEach(([d, keys]) => { if (keys.length) get(d).psteps = keys; });
  const P = [['start', 'разобрались с целями'], ['order', 'заказали средства'], ['arrived', 'пришли средства'], ['char', 'выполнили миссию характера'], ['grat', 'записали благодарности'], ['read', 'почитали'], ['book', 'дочитали книгу'], ['lesson', 'прошли урок'], ['focus', 'провели фокус-сессию'], ['challenge', 'закрыли челлендж недели'], ['goal', 'достигли цели сезона'], ['photo', 'сделали фото прогресса'], ['proto', 'обновили план протоколов'], ['activity', 'написали в чат'], ['care', 'сделали паузу в уходе'], ['rank', 'взяли новый уровень']];
  return Object.values(days).sort((a, b) => b.date.localeCompare(a.date)).map((day) => {
    const phrases = [], details = [];
    const types = day.ev.map((e) => e.type);
    P.slice(0, 3).forEach(([t, p]) => types.includes(t) && phrases.push(p));
    if (day.tasks.length) {
      const pl = [...new Set(day.tasks.map((id) => id.split(':')[0]))].filter((p) => PILLARS[p]).map((p) => PILLARS[p].verb);
      phrases.push((types.includes('closed') ? 'закрыли день: ' : 'сделали ') + pl.join(' и '));
    }
    if (day.psteps) phrases.push(`сделали ${day.psteps.length} ${plural(day.psteps.length, 'шаг', 'шага', 'шагов')} по протоколам`);
    P.slice(3).forEach(([t, p]) => types.includes(t) && phrases.push(p));
    if (!phrases.length && types.includes('note')) phrases.push('записали ощущения');
    day.tasks.forEach((id) => { const [p, k] = id.split(':'); if (PILLARS[p] && TASKS[p] && TASKS[p][k]) details.push(PILLARS[p].code + ' · ' + TASKS[p][k]); });
    (day.psteps || []).forEach((key) => { const [id, i] = key.split(':'), pr = PROTOCOLS[id]; if (pr && pr.steps[i]) details.push(pr.t + ' · ' + pr.steps[i].t); });
    day.ev.filter((e) => e.type !== 'closed').forEach((e) => details.push(e.text));
    return { date: day.date, n: dayNum(day.date), title: cap(phrases.join(', ') || 'Без отметок'), details, closed: closed(day.date) };
  });
}

// Время храним в часах от полуночи; после полуночи — 24+ (00:30 = 24.5), чтобы считать длительность без перескоков
const SL_BED = [[21.75, 'до 22'], [22.5, '22–23'], [23.5, '23–00'], [24.5, '00–01'], [25.75, 'после 01']];
const SL_WAKE = [[5.75, 'до 6'], [6.5, '6–7'], [7.5, '7–8'], [8.5, '8–9'], [9.5, 'после 9']];

const SL_MORN = [['ok', '⚡ Бодро'], ['tired', '🧟 Разбитый'], ['coffee', '☕ Без кофе никак']];
const SL_BLOCK = [['phone', 'Телефон в кровати'], ['caffeine', 'Кофе или энергетики после обеда'], ['weekend', 'В выходные сплю до обеда'], ['food', 'Ем поздно вечером'], ['late', 'Учёба, работа или игры допоздна'], ['env', 'Шум или свет в комнате']];

const slHM = (h) => { const m = Math.round(((h % 24) + 24) % 24 * 60); return z(Math.floor(m / 60) % 24) + ':' + z(m % 60); };
const slDur = (h) => { const m = Math.round(h * 60); return Math.floor(m / 60) + (m % 60 ? ' ч ' + m % 60 + ' мин' : ' ч'); };
function sleepProgram(sl) {
  if (!sl || sl.bed == null || sl.wake == null) return null;
  const has = (x) => (sl.block || []).includes(x);
  const wake = sl.wake + 24, dur = wake - sl.bed;
  // Цель — 8 часов сна; отбой не позже 23:30 и не раньше, чем нужно для 8 часов
  const bedT = Math.min(sl.bed, Math.max(wake - 8, 21.5), 23.5);
  const shift = Math.max(0, Math.round((sl.bed - bedT) * 4) / 4); // в часах, шаг 15 минут
  const steps = Math.round(shift * 4), days = steps * 2;
  const bad = dur < 7.5 || sl.bed >= 24 || sl.fall === 'long' || sl.fall === 'wake' || !!(sl.morn && sl.morn !== 'ok');
  const habits = [];
  if (shift) habits.push(`Отбой на 15 минут раньше каждые 2 дня: ${slHM(sl.bed)} → ${slHM(bedT)}`);
  habits.push(has('weekend') ? `Подъём в ${slHM(sl.wake)} каждый день` : `Подъём в ${slHM(sl.wake)} каждый день — в выходные максимум на час позже`);
  if (sl.morn && sl.morn !== 'ok') habits.push('10 минут дневного света в первый час после подъёма — так проще проснуться и вечером легче уснуть');
  if (sl.morn === 'coffee') habits.push('Первый кофе — через час после подъёма, не сразу');
  if (has('caffeine')) habits.push('Кофе, чай и энергетики — не позже 14:00');
  if (has('phone')) habits.push('За 30 минут до сна телефон заряжается не у кровати');
  if (has('late')) habits.push(`Стоп учёбе, работе и играм в ${slHM(bedT - 0.75)} — за 45 минут до отбоя`);
  if (has('food')) habits.push('Последняя еда — за 2–3 часа до сна');
  if (has('weekend')) habits.push('В выходные вставай максимум на час позже: сон до обеда сбивает режим, как перелёт через часовые пояса');
  if (has('env')) habits.push('Маска для сна и беруши, в комнате прохладно — 18–20°');
  if (sl.fall === 'long') habits.push('Не уснул за 20 минут — встань, почитай бумажную книгу при тусклом свете и вернись');
  if (sl.fall === 'wake') habits.push('За час до сна без больших порций воды, в комнате прохладно и темно');
  if (habits.length < 3) habits.push('За 30 минут до сна — без экрана', 'В комнате темно и прохладно');
  const verdict = !bad ? 'Режим в порядке — держим его' : dur < 6.5 ? 'Сильный недосып — восстановим постепенно' : shift ? 'Сдвигаем отбой без мучений' : 'Сон есть, но он не восстанавливает — чиним качество';
  return { bed: sl.bed, wake: sl.wake, dur, bedT, durT: wake - bedT, shift, days, bad, habits: habits.slice(0, 6), verdict };
}

}
function woStop() { if (wo) clearInterval(wo.tid); wo = null; }
function woRun() { clearInterval(wo.tid); wo.paused = false; wo.tid = setInterval(woTick, 1000); }
function woTick() {
  if (!wo || !modal || modal.kind !== 'wo') return woStop();

function woNext() {

    wo.phase = 'rest'; wo.left = REST;
  } else { if (wo.phase === 'rest') wo.i++; wo.phase = 'work'; wo.left = wo.w.items[wo.i][1]; if (!wo.tid || wo.paused) woRun(); }
  haptic('medium'); render();
}
function woPrev() {
  if (wo.phase === 'work' && wo.i > 0 && wo.left >= wo.w.items[wo.i][1] - 2) wo.i--;
  wo.phase = 'work'; wo.left = wo.w.items[wo.i][1]; haptic('light'); render();
}
function woFinish() {
  clearInterval(wo.tid);

const mmss = (s) => Math.floor(s / 60) + ':' + z(s % 60);

function toggleStep(key) {
  const d = today(), id = key.split(':')[0], a = S.protos.active.find((x) => x.id === id);
  if (!a) return;
  S.pdone = S.pdone || {}; S.pfull = S.pfull || {};
  const arr = S.pdone[d] = S.pdone[d] || [], fk = d + ':' + id, before = xp();
  withRankCheck(() => {
    const i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else { arr.push(key); justDone = key; }
    const t = protoToday(a);
    if (t.req && t.reqDone === t.req) S.pfull[fk] = 1; else delete S.pfull[fk];
  });
  const got = xp() - before;
  if (got > 0) { floatXP(`+${got} XP`); haptic(S.pfull[fk] ? 'success' : 'medium'); if (got > 5) { confetti(); toast('День протокола закрыт'); } } else haptic('light');
  save(); render();
}
function activateNext() {
  const P = S.protos;
  while (P.active.length < MAX_ACTIVE && P.queue.length) {
    const id = P.queue.shift();
    P.active.push({ id, start: today() });
    addEvent('proto', 'Начали протокол: ' + PROTOCOLS[id].t);
  }
}

// Режем текст на карточки: заголовок начинает новую, слишком длинный раздел делится на части
function storySlides(it) {
  const slides = []; let cur = { h: '', parts: [], len: 0 };
  const push = () => { if (cur.parts.length) slides.push(cur); };
  it.body.forEach((b) => {
    if (typeof b !== 'string' && b.h) { push(); cur = { h: b.h, parts: [], len: 0 }; return; }
    const len = String(typeof b === 'string' ? b : b.q).length;
    if (cur.len && cur.len + len > 640) { push(); cur = { h: cur.h, cont: true, parts: [], len: 0 }; }
    cur.parts.push(b); cur.len += len;
  });
  push();
  return slides;
}
function stGo(d) {
  const tr = document.getElementById('stTrack'); if (!tr) return;
  const i = Math.round(tr.scrollLeft / tr.clientWidth) + d;
  haptic('light');
  tr.scrollTo({ left: i * tr.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
}
// Какая карточка сейчас на экране: полоска сверху, счётчик, стрелки
function stSync() {
  const tr = document.getElementById('stTrack'); if (!tr || !reader) return;
  const slides = tr.children, last = slides.length - 1;
  const i = Math.max(0, Math.min(last, Math.round(tr.scrollLeft / tr.clientWidth)));
  reader.i = i;
  if (i === last) reader.bottom = true;
  for (let k = 0; k <= last; k++) slides[k].classList.toggle('on', k === i);
  const bar = document.getElementById('stBar');
  if (bar) [...bar.children].forEach((b, k) => b.classList.toggle('on', k <= i));
  const cnt = document.getElementById('stCnt'); if (cnt) cnt.textContent = `${i + 1} / ${last + 1}`;
  const pv = document.getElementById('stPrev'), nx = document.getElementById('stNext');
  if (pv) pv.disabled = i === 0;
  if (nx) nx.disabled = i === last;
}

// «Прочитал» открывается, когда карточки долистаны до последней и прошло хотя бы ~6 секунд на минуту чтения
let readerTimer = null;
function readerReady() {
  if (!reader || reader.kind === 'book') return true;
  const it = (reader.kind === 'lesson' ? ALL_LESSONS : ARTICLES).find((x) => x.id === reader.id);
  if (!it) return false;
  return !!reader.bottom && Date.now() - reader.t0 >= it.min * 6000;
}
function armReader() {
  clearInterval(readerTimer);
  const tr = document.getElementById('stTrack');
  if (!tr) return;
  // после перерисовки возвращаемся на ту же карточку
  if (reader.i) tr.scrollLeft = reader.i * tr.clientWidth;
  let tick = false;
  tr.addEventListener('scroll', () => { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; stSync(); upd(); }); }, { passive: true });
  const btn = document.getElementById('markBtn');
  const ids = reader.kind === 'lesson' ? S.lessons : S.articles;
  const paid = readsToday(ids) < (reader.kind === 'lesson' ? CAP.lesson : CAP.article);
  const upd = () => {
    if (!btn || !readerReady()) return;
    btn.disabled = false;
    btn.textContent = paid ? `Прочитал · +${reader.kind === 'lesson' ? 25 : 5} XP` : 'Прочитал · XP на сегодня уже получен';
    clearInterval(readerTimer);
  };
  stSync();
  if (btn) readerTimer = setInterval(upd, 1000);
  upd();
}

// ---------- фото ----------
function readPhoto(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, (max || 600) / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

// ---------- фото: камера или галерея ----------
// Telegram на Android игнорирует capture и открывает галерею, на iPhone — сразу камеру.
// Поэтому даём выбор сами, а камеру открываем прямо внутри приложения (если нельзя — камерой телефона).
let camStream = null, pui = null;
function pickFile(kind, cam) {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*'; i.style.display = 'none';
  if (cam) i.setAttribute('capture', 'user');
  i.onchange = async () => {
    const f = i.files && i.files[0]; i.remove();
    if (!f) return;
    try { await usePhoto(kind, await readPhoto(f, kind === 'w-item' ? 1280 : 600)); } catch (e) { toast('Не получилось открыть фото'); }
  };
  document.body.appendChild(i); i.click();
}
function camStop() { if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
function closePhotoUI() { camStop(); const w = document.getElementById('photoUI'); if (w) w.remove(); pui = null; }
function photoSheet(kind) {
  closePhotoUI();
  pui = { kind, facing: kind === 'w-item' ? 'environment' : 'user' };
  const w = document.createElement('div');
  w.id = 'photoUI'; w.className = 'modal';
  w.innerHTML = `<div class="sheet"><span class="mono">[ фото ]</span>

function photoClick(e) {
  const w = document.getElementById('photoUI'), b = e.target.closest('[data-p]');
  if (!pui || !w) return;
  if (!b) { if (e.target === w) closePhotoUI(); return; }

  if (p === 'x') closePhotoUI();

function camOpen() {
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) { const k = pui.kind; closePhotoUI(); return pickFile(k, true); }
  const w = document.getElementById('photoUI');
  w.className = 'cam';
  w.innerHTML = `<video id="camV" playsinline autoplay muted></video>${pui.kind === 'w-item' ? '' : '<div class="cam-oval"></div>'}

async function camStart() {
  camStop();
  const me = pui;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: me.facing, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    const v = document.getElementById('camV');
    if (pui !== me || !v) { s.getTracks().forEach((t) => t.stop()); return; } // окно уже закрыли
    camStream = s; v.srcObject = s; v.classList.toggle('mirror', me.facing === 'user');
    v.play().catch(() => {});
  } catch (err) {
    const er = document.querySelector('#photoUI .cam-err');
    if (!er) return;
    document.querySelectorAll('#photoUI .cam-bot, #photoUI .cam-oval, #photoUI [data-p=flip]').forEach((x) => { x.style.display = 'none'; });
    er.hidden = false;
    er.innerHTML = `<div style="font-weight:800;font-size:17px">Камера внутри не открылась</div>

function camSnap() {
  const v = document.getElementById('camV');
  if (!v || !v.videoWidth) return;
  const k = Math.min(1, (pui.kind === 'w-item' ? 1280 : 600) / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  const x = c.getContext('2d');
  if (pui.facing === 'user') { x.translate(c.width, 0); x.scale(-1, 1); } // как в зеркале — так, как человек себя видел
  x.drawImage(v, 0, 0, c.width, c.height);

// Запуск: сначала то, что есть в телефоне, потом сверяемся с облаком Telegram
function start() {
  let shown = false;
  const show = () => { if (shown) return; shown = true; render(); hydratePhotos(); };
  // Телефон пустой (новое устройство или память почистили) — даём облаку пару секунд, чтобы не показать онбординг зря
  if (S.onboarded || !cloud.ok) show();
  else setTimeout(show, 2500);
  cloud.pull().then((c) => {
    if (c && (c._ts || 0) > (S._ts || 0)) {
      const local = S.photos || [];
      S = c;
      S.photos = (S.photos || []).map((p) => local.find((l) => l.id === p.id) || p);
      S.photos.forEach((p) => { if (!p.data) storedPhotos.add(p.id); });
      persistLocal();
      if (shown) { render(); hydratePhotos(); } else show();
    } else {
      if ((S._ts || 0) > ((c && c._ts) || 0)) cloud.schedule();
      show();
    }
  }).catch(show).then(() => { if (S.onboarded) track('open', { day: dayNum(today()) }); });
  meRefresh(/paid=1/.test(location.search));
}

// ---------- вырезка фона ----------
// Нейросеть работает прямо в телефоне (~56 МБ: модель + движок), качается один раз и дальше берётся из кэша.
// Модель quint8 — под процессор телефона. fp16 на телефоне без видеокарты считалась минутами и вешала приложение.
// Чёткость края даёт фото в 1280 px и чистка маски в wFinish, а не тяжёлая модель.
const BG_MB = 56;
const bgCfg = () => ({ model: 'isnet_quint8', device: 'cpu', output: { format: 'image/png' }, progress: bgProg });
const bgParts = {};

  el.textContent = /fetch/.test(k) && mb < BG_MB * 0.98 ? `Подготовка · ${Math.min(99, Math.round(mb / BG_MB * 100))}%` : 'Убираю фон…';
}
const bgLoad = () => (bgLib = bgLib || import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm').catch((e) => { bgLib = null; throw e; }));

// Быстрая вырезка: лёгкая модель u2netp (4,6 МБ, лежит рядом с приложением) — около секунды на вещь.
// Тяжёлая модель выше остаётся для кнопки «Вырезать точнее».
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
let u2Sess = null;
function u2Load() {
  return u2Sess || (u2Sess = new Promise((res, rej) => {
    if (window.ort) return res();
    const s = document.createElement('script'); s.src = ORT + 'ort.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  }).then(() => { ort.env.wasm.wasmPaths = ORT; return ort.InferenceSession.create('u2netp.onnx', { executionProviders: ['wasm'] }); })
    .catch((e) => { u2Sess = null; throw e; }));
}
async function removeBgFast(src) {
  const sess = await u2Load(), S = 320;
  const img = new Image(); img.src = src; await img.decode();
  const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, S, S);
  const d = cx.getImageData(0, 0, S, S).data, f = new Float32Array(3 * S * S), mean = [0.485, 0.456, 0.406], sd = [0.229, 0.224, 0.225];
  for (let i = 0; i < S * S; i++) for (let k = 0; k < 3; k++) f[k * S * S + i] = (d[i * 4 + k] / 255 - mean[k]) / sd[k];
  const out = await sess.run({ [sess.inputNames[0]]: new ort.Tensor('float32', f, [1, 3, S, S]) });
  const m = out[sess.outputNames[0]].data;
  let mn = Infinity, mx = -Infinity;
  for (const v of m) { if (v < mn) mn = v; if (v > mx) mx = v; }
  const mc = document.createElement('canvas'); mc.width = S; mc.height = S;
  const mctx = mc.getContext('2d'), md = mctx.createImageData(S, S);
  for (let i = 0; i < S * S; i++) md.data[i * 4 + 3] = Math.round(((m[i] - mn) / (mx - mn || 1)) * 255);
  mctx.putImageData(md, 0, 0);
  // маску растягиваем до размера фото и вырезаем ею вещь
  const o = document.createElement('canvas'); o.width = img.width; o.height = img.height;
  const ox = o.getContext('2d'); ox.drawImage(img, 0, 0);
  ox.globalCompositeOperation = 'destination-in'; ox.imageSmoothingQuality = 'high'; ox.drawImage(mc, 0, 0, img.width, img.height);
  return o.toDataURL('image/png');
}
// Чистим маску: убираем мелкие ошмётки фона, делаем край чётче, обрезаем пустые поля, определяем цвет
function wFinish(src, raw) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height, c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0);
      const id = x.getImageData(0, 0, w, h), d = id.data, n = w * h;

            if (qx > 0 && !lab[q - 1] && d[(q - 1) * 4 + 3] >= 128) { lab[q - 1] = L; st[top++] = q - 1; }
            if (qx < w - 1 && !lab[q + 1] && d[(q + 1) * 4 + 3] >= 128) { lab[q + 1] = L; st[top++] = q + 1; }
            if (q >= w && !lab[q - w] && d[(q - w) * 4 + 3] >= 128) { lab[q - w] = L; st[top++] = q - w; }
            if (q < n - w && !lab[q + w] && d[(q + w) * 4 + 3] >= 128) { lab[q + w] = L; st[top++] = q + w; }
          }
          sizes.push(cnt);

        let big = 0; for (const s of sizes) if (s > big) big = s;
        const keep = sizes.map((s) => s >= big * 0.12);
        for (let p = 0; p < n; p++) {
          let a = d[p * 4 + 3];
          if (a >= 128 && !keep[lab[p]]) a = 0;
          // мягкий край оставляем, полупрозрачную дымку убираем
          a = a < 50 ? 0 : a > 205 ? 255 : Math.round(((a - 50) / 155) * 255);
          d[p * 4 + 3] = a;
        }
        x.putImageData(id, 0, 0);
      }
      const hist = {};

      let url = o.toDataURL('image/webp', 0.88);
      if (!url.startsWith('data:image/webp')) url = o.toDataURL('image/png');
      const top = Object.entries(hist).sort((a, b) => b[1] - a[1])[0];
      let color = '';
      if (top) {
        const rgb = top[0].split(',').map((v) => v * 16 + 8);
        color = W_COLORS.map(([nm, c2]) => [nm, (c2[0] - rgb[0]) ** 2 + (c2[1] - rgb[1]) ** 2 + (c2[2] - rgb[2]) ** 2]).sort((a, b) => a[1] - b[1])[0][0];

}

// Снимок образа для стилиста: вещи на белом фоне ровно так, как человек их разложил (с размерами, поворотами и слоями)

    if (!g || !ptr.has(e.pointerId)) return;
    e.preventDefault();
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = wlay.find((q) => q.id === g.id);
    if (!p) return;
    const R = g.rect, s0 = g.start, ids = [...g.pts.keys()].filter((k) => ptr.has(k));
    const cx = R.left + (s0.x / 100) * R.width, cy = R.top + (s0.y / 100) * R.height;
    let k = 1, rot = 0, dx = 0, dy = 0;
    if (ids.length >= 2) {
      const [a0, b0] = [g.pts.get(ids[0]), g.pts.get(ids[1])], [a1, b1] = [ptr.get(ids[0]), ptr.get(ids[1])];
      k = Math.hypot(b1.x - a1.x, b1.y - a1.y) / (Math.hypot(b0.x - a0.x, b0.y - a0.y) || 1);
      rot = (Math.atan2(b1.y - a1.y, b1.x - a1.x) - Math.atan2(b0.y - a0.y, b0.x - a0.x)) * 180 / Math.PI;
      dx = ((a1.x + b1.x) - (a0.x + b0.x)) / 2; dy = ((a1.y + b1.y) - (a0.y + b0.y)) / 2;
    } else if (ids.length === 1) {
      const a0 = g.pts.get(ids[0]), a1 = ptr.get(ids[0]);
      if (g.handle) {
        k = Math.hypot(a1.x - cx, a1.y - cy) / (Math.hypot(a0.x - cx, a0.y - cy) || 1);
        rot = (Math.atan2(a1.y - cy, a1.x - cx) - Math.atan2(a0.y - cy, a0.x - cx)) * 180 / Math.PI;
      } else { dx = a1.x - a0.x; dy = a1.y - a0.y; }
    }
    k = lim(k, 12 / s0.w, 140 / s0.w);
    p.w = s0.w * k; p.h = s0.h * k; p.r = Math.round(((s0.r || 0) + rot) * 10) / 10;
    if (Math.abs(p.r % 90) < 3 || Math.abs(p.r % 90) > 87) p.r = Math.round(p.r / 90) * 90; // прилипает к ровному
    p.x = lim(s0.x + (dx / R.width) * 100, 4, 96); p.y = lim(s0.y + (dy / R.height) * 100, 4, 96);
    apply(p);
  }, { passive: false });
  const up = (e) => {
    if (!ptr.has(e.pointerId)) return;
    ptr.delete(e.pointerId);
    if (!ptr.size) { g = null; return; }
    if (g) { g.handle = false; snap(); }
  };
  addEventListener('pointerup', up, true);
  addEventListener('pointercancel', up, true);
})();

// Уровень: от уровня n к n+1 нужно 8n заданий (вдвоём максимум 6 в день).
// Всего: ур. 2 — 8, ур. 5 — 80 (≈ 3 недели на максимуме), ур. 10 — 360 (≈ 2 месяца), ур. 20 — 1520 (≈ 8 мес.), ур. 30 — 3480 (≈ 1,6 года)
const petLvlXp = (l) => 4 * (l - 1) * l;
function petLevel(xp) {
  let l = 1;
  while (petLvlXp(l + 1) <= xp) l++;
  const a = petLvlXp(l), b = petLvlXp(l + 1);
  return { lvl: l, cur: xp - a, need: b - a, pct: Math.round((xp - a) / (b - a) * 100) };
}
// Старый сервер не считал xp — прикидываем по статам, чтобы уровень не был нулевым
const petXp = (pt) => (typeof pt.xp === 'number' ? pt.xp : Math.max(0, Math.round((pt.st.skin + pt.st.body + pt.st.style + pt.st.mind - 20) / 4)));
const petUnlocked = (pt) => PET_ITEMS.filter((it) => Math.max(pt.best || 0, pt.streak || 0) >= it.d);
// Что надето: по умолчанию всё открытое (в слоте — самое «дорогое»); можно снимать/надевать в коллекции
function petWear(code, pt) {
  const own = petUnlocked(pt), saved = (S.petWear || {})[code];
  const list = saved ? own.filter((it) => saved.includes(it.id)) : own;
  const slot = {};
  list.forEach((it) => { slot[it.slot] = it.id; });
  return Object.values(slot);
}
// Настроение «по умолчанию», когда он ничего не делает
function petMood(st, opt) {
  const h = opt.hour == null ? new Date().getHours() : opt.hour, a = petAvg(st) / 100;
  if (opt.mood) return opt.mood;
  if (h >= 23 || h < 6) return 'sleep';
  if (a < 0.12 || opt.forgot) return 'sad';
  if (st.mind < 25) return 'dazed';
  if (a < 0.35) return 'meh';
  if (a < 0.7) return 'ok';
  return 'joy';
}

function frDemoCall(action, p) {
  const s = FR || FR_DEMO(), f = (l) => l.find((x) => x.code === p.code);
  if (action === 'friends') return JSON.parse(JSON.stringify(s));
  if (action === 'pet' || action === 'pet_care') {
    const pt = PET[p.code] ? JSON.parse(JSON.stringify(PET[p.code])) : PET_DEMO(p.code);
    if (action === 'pet_care') {
      if (pt.today.me >= pt.per) return { error: 'pet_limit' };
      const a = PET_ACTS.find((x) => x[0] === p.act);
      pt.today.me++; pt.xp = (pt.xp || 0) + 1; pt.st[a[3]] = Math.min(100, pt.st[a[3]] + 4); pt.log = [{ me: true, a: a[0] }, ...pt.log].slice(0, 20);
      if (pt.today.me === 1 && pt.today.friend > 0) { pt.streak++; pt.best = Math.max(pt.best, pt.streak); }
    }

    if (f(s.outgoing)) return { error: 'pending' };
    const inc = f(s.incoming);
    if (inc) { s.incoming = s.incoming.filter((x) => x !== inc); s.friends.unshift({ ...inc, stats: { streak: 1, best: 3, lvl: 2, lname: 'Новичок', day: today(), done: 0, xp: 90 } }); return s; }

}
